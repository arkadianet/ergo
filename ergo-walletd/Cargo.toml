[package]
name = "ergo-walletd"
description = "Standalone watch-only Ergo wallet daemon."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "ergo_walletd"
path = "src/lib.rs"

[[bin]]
name = "ergo-walletd"
path = "src/main.rs"

[dependencies]
ergo-wallet          = { workspace = true }
ergo-wallet-protocol = { workspace = true }
ergo-wallet-service  = { workspace = true }
ergo-primitives      = { workspace = true }
ergo-ser             = { workspace = true }
axum                = { workspace = true }
hyper               = { workspace = true }
hyper-util          = { workspace = true }
tower                = { workspace = true }
clap                = { workspace = true, features = ["derive"] }
hex                 = { workspace = true }
libc                = { workspace = true }
reqwest             = { workspace = true, features = ["blocking", "rustls-tls"] }
serde               = { workspace = true, features = ["derive"] }
serde_json          = { workspace = true }
thiserror            = { workspace = true }
tokio               = { workspace = true, features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal", "io-util"] }
toml                = { workspace = true }
tracing             = { workspace = true }
tracing-subscriber  = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# TEST-TARGET ONLY. The daemon's normal dependency boundary deliberately
# excludes the node crates (it talks to a node over HTTP). The integration
# test in `tests/it/node_api.rs` stands up the *real* `ergo-api` chain
# routes on a loopback port, backed by a real seeded `ergo-state`
# `StateStore` and the real `ergo-node` chain adapter, so the daemon's
# `HttpChainClient` + sync path is exercised over real HTTP with the real
# `api_key` gate instead of a hand-rolled stub. These are dev-only: they
# never enter the released binary's dependency graph.
ergo-api = { workspace = true }
ergo-node = { workspace = true }
ergo-state = { workspace = true, features = ["test-helpers"] }
# TEST-TARGET ONLY, and only because of `tests/it/shadow.rs`. The shadow
# harness drives the *embedded* side through the production
# `StateStore::apply_block`, whose argument is a `CheckedBlock`. Building
# one needs `CheckedBlock::from_parts` (already `test-helpers`-gated in
# ergo-validation) and a `CheckedTransaction`, whose only constructors are
# `validate_transaction` / `validate_transaction_parsed`. Without this
# dev-dependency the embedded side would have to fall back to
# `apply_block_unchecked_with_wallet_for_test`, which passes an EMPTY
# `block_txs_owned` and therefore tracks no boxes at all — the shadow
# comparison would be vacuous exactly where it matters. Dev-only: the
# released binary's dependency graph is unchanged.
ergo-validation = { workspace = true, features = ["test-helpers"] }
# TEST-TARGET ONLY. `tests/it/shadow.rs` builds the real production
# `ergo-node` `WalletStateHook`, whose shared wallet state is a
# `parking_lot::RwLock<WalletState>`. Same workspace version ergo-node uses,
# so the lock type is the same type.
parking_lot    = { workspace = true }
bincode = { workspace = true }
redb = { workspace = true }

[[test]]
name = "it"
path = "tests/it/main.rs"
