# Ergo standalone wallet daemon — reference config.
#
# Run with:
#
#   ergo-walletd --config ergo-walletd.toml
#
# Every key is documented by type in
# docs/configuration.md#ergo-walletdtoml-the-standalone-wallet-daemon.
#
# This config selects WATCH-ONLY mode, the default. It has no secret storage
# or mutable API; it tracks the public keys listed in the descriptor file and
# reports what it finds in confirmed blocks. For the opt-in encrypted seed
# lifecycle API, use ergo-walletd-seed.toml with a separate data directory.

mode = "watch_only"
network  = "mainnet"             # "mainnet" | "testnet" (required identity;
                                 # default "mainnet"). Decides the address
                                 # prefix used for every address the local API
                                 # returns, and must match the network
                                 # `node_url` serves.
data_dir = "./ergo-walletd-data" # Holds wallet.redb, the daemon's only
                                 # database. Created on first start.
node_url = "http://127.0.0.1:9099" # The node's operator API base URL. The daemon
                                 # reads /api/v1/chain/* from it and nothing
                                 # else. http(s) only, no credentials, query,
                                 # or fragment. Plain http only for a loopback
                                 # host; a remote node needs https.
# node_ca_file = "./node-ca.pem" # Trust only these CAs for an https node_url.
api_key_file = "./node-api-key"  # File holding the node's `api_key` request
                                 # header value. Must be a regular file that is
                                 # NOT readable by group or other (chmod 600);
                                 # the daemon refuses to start otherwise and
                                 # never logs the value.
local_api_key_file = "./wallet-api-key" # Independent credential for this
                                 # daemon's own API: every request needs its
                                 # value in the `api_key` header. Watch-only
                                 # balances, addresses and history are private
                                 # data. Same file rules as api_key_file, and
                                 # it must differ from the node credential.
descriptor_file = "./descriptors.toml" # Public descriptor file: compressed
                                 # secp256k1 public keys, derivation paths, and
                                 # labels. Any secret field is a hard error.
shutdown_timeout_secs = 5
sync_interval = "15s"            # How often the sync loop runs. Accepts plain
                                 # seconds or a duration string ("500ms",
                                 # "30s", "2m").
sync_batch = 256                 # Apply budget: max blocks APPLIED per sync
                                 # pass (1..=1024). Not a request size — a pass
                                 # may reach the tip through many HTTP calls.
blocks_page = 1                  # Request budget: max blocks asked for in ONE
                                 # blocks-since call (1..=1024). This is what
                                 # bounds a single response body, and it is
                                 # independent of sync_batch: the wire form
                                 # hex-encodes every transaction and output
                                 # box, so a page of N blocks costs roughly
                                 # four times their bytes and must fit the
                                 # daemon's 16 MiB response cap. 1 is the
                                 # largest page whose *worst legal* body
                                 # provably fits: one block at the documented
                                 # 2 MiB maxBlockSize is 8 MiB of hex, so two
                                 # would be 16 MiB before any JSON envelope. A block too large for even a
                                 # one-block page is a terminal, named error —
                                 # the daemon never retries with a smaller
                                 # page.

# ---------------------------------------------------------------------------
# Local read-only API listener. At least one of the two is required. Specify
# them here in [api] or as top-level keys (`unix_socket` / `tcp_fallback`),
# never both forms at once.
# ---------------------------------------------------------------------------
[api]
# Owner-only (0o600) Unix socket. The daemon writes a "<socket>.owner" marker
# so a stale socket is reclaimed but a live one is never stolen.
unix_socket = "./ergo-walletd.sock"
# Optional loopback-only TCP listener; a non-loopback address is rejected at
# load, so the read API is never exposed to the network by configuration.
# tcp_fallback = "127.0.0.1:3033"
# Extra Host header values accepted on tcp_fallback besides its own loopback
# names (DNS-rebinding protection), e.g. ["wallet.lan:3033"].
# allowed_hosts = []
