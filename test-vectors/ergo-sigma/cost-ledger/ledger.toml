  {id="EVAL-eq-tokens", cat="EVAL", scala="data/shared/src/main/scala/sigma/data/DataValueComparer.scala:183; There is no universal MatchType charge before primitive equality. For equal, well-typed token collections containing `q` `(32-byte ID, Long amount)` tuples, the composition is `1 + P(10,2,1;q) + q*(4 + 1 + P(15,2,128;32) + 3) = 11 + 27*q`. The ledger’s **two** per-token MatchType charges overcounts by one per token. Anchors: `data/shared/src/main/scala/sigma/data/DataValueComparer.scala:183`, `:319`, `:332`, `:314`. Early mismatch changes examined counts and can skip amount comparison.", rust="ergo-sigma/src/cost_table.rs:375-395", layer="L2", state="CLOSED", tests=["ergo-sigma::it::cost_ledger_fixtures::cost_ledger_fixtures_jvm_verify_fields_match"], note="JVM fixtures/eval/tokens-fallback.json.gz and equality-edges.json prove equal, ID-mismatch, amount-mismatch and length-mismatch token equality. Independent full-verification costs agree with Scala recursive composition; Rust no longer exhibits the suspected extra MatchType charge."},
