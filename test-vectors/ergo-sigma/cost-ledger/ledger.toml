  {id="INTERP-crypto-trivial-I013", cat="INTERP", scala="interpreter/shared/src/main/scala/sigmastate/interpreter/Interpreter.scala:589", rust="ergo-sigma/src/crypto_cost.rs", layer="L1,L2", state="CLOSED", tests=["ergo-sigma::it::cost_ledger_fixtures::cost_ledger_fixtures_jvm_verify_fields_match"], note="JVM 6.0.2 verify: fixtures/interpreter/crypto-shapes.json.gz; serialized true and false constants both charge eval=5, crypto=0, total=22 BC with init=17; verdicts Accept and RejectScript respectively."},
  {id="INTERP-accumulator-initial-scope-I020", cat="INTERP", scala="interpreter/shared/src/main/scala/sigmastate/interpreter/CostAccumulator.scala:21", rust="unverified", layer="L1,L3", state="OPEN", tests=[], note="OPEN: JVM CostAccumulator constructor stores initialCost unchecked; totalCost reads it unchecked and add performs the limit comparison. L2 verify applies interpreter initialization/gates before evaluator construction, so nonzero init_cost_block cases cannot isolate construction/read above limit from add(0). Rust CostAccumulator::new starts at zero and offers no initial-scope constructor. Need direct JVM accumulator observations and an explicitly matched Rust entry path; ordinary initialized verification is insufficient."},
