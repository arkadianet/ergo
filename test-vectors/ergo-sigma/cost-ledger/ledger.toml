  {id="EVAL-deferred-charge-on-exception", cat="EVAL", scala="interpreter/shared/src/main/scala/sigmastate/interpreter/CErgoTreeEvaluator.scala:399; Fixed/type-based/known-length helpers charge before the body. Unknown-length `addSeqCost` runs the body first and then charges; a throw skips the outer deferred charge, leaving earlier nested charges. `interpreter/shared/src/main/scala/sigmastate/interpreter/CErgoTreeEvaluator.scala:296`, `:333`, `:370`, `:399`.", rust="ergo-sigma/src/evaluator/cost.rs; ergo-sigma/src/evaluator/opcodes/boolean.rs", layer="L2,L3", state="CLOSED", tests=["ergo-sigma::it::cost_ledger_fixtures::cost_ledger_fixtures_jvm_verify_fields_match"], note="Fixed BoolToSigmaProp to charge after operand evaluation (trees.scala:37-39). JVM fixtures/eval/sigma-booleans.json.gz and sigma-throws.json.gz match charged-to-failure observations; recursive unknown-length collection charges remain deferred and are skipped on throws."},
  {id="INTERP-embedded-script-deser", cat="INTERP", scala="interpreter/shared/src/main/scala/sigmastate/interpreter/Interpreter.scala:81; enumeration I003: measured deserialization cost of embedded scripts (DeserializeContext/Register) beyond the tree-byte init cost", rust="ergo-sigma/src/reduce.rs / dispatch.rs", layer="L2", state="CLOSED", tests=["ergo-sigma::it::cost_ledger_fixtures::cost_ledger_fixtures_jvm_verify_fields_match"], note="JVM 6.0.2 verify: fixtures/interpreter/deserialize-substitution.json.gz; segregated v3 trees with init=17, context/register scripts of 2 and 300 bytes, live/dead and missing variables. Task 0.8 eager substitution charges 2 BC per embedded byte before evaluation, without OP descriptors. Fresh JVM deserialize-types.json.gz pins absent/default and present incompatible registers plus constant/ConcreteCollection mismatches on live/dead branches; Shared static typing preserves tuple/SelectField, collection transforms, Apply and all 199 JVM registry signatures. Fix3 adds 64 accepting live/dead context/register cases in deserialize-types.json.gz, including the six required SigmaProp result shapes, while retaining all 16 negative/default probes."},
  {id="VERSION-subst-retention", cat="VERSION", scala="interpreter/shared/src/main/scala/sigmastate/interpreter/Interpreter.scala:246; What is retained is the **whole-tree substitution cost**, not substituted constants. Both branches check `2*ergoTree.bytes.length` BC; A6 uses `context1`, older activation uses original context. `interpreter/shared/src/main/scala/sigmastate/interpreter/Interpreter.scala:246`, `:255`. This activation gate also affects old-version trees.", rust="ergo-sigma/src/reduce.rs", layer="L2", state="CLOSED", tests=["ergo-sigma::it::cost_ledger_fixtures::cost_ledger_fixtures_jvm_verify_fields_match"], note="Fix commit 3e909edf1d9a61ce45e5f03fcea62b0061c8cad2. Task 9.2-fix; paired pinned JVM evidence and exact failure/limit checks. Whole-tree substitution checks the limit before discarding pre-A6 cost. JVM init 17, activation 2 unrestricted total 23; limits 22/23/24/36 reject with total 37. A6 (activation >= 3) retains the charge and unrestricted total is 43. fixtures/version/subst-retention.json.gz covers live/dead nodes, tree versions 0/1/2 and measured limits."},
  {id="BLOCK-param-voting", cat="BLOCK", scala="16,384 is a threshold tested against the **current** maxBlockCost before lowering, not a clamp on the proposed value. Generic step is `max(1,current/100)`. `ergo-core/src/main/scala/org/ergoplatform/settings/Parameters.scala:170`, `:176`, `:354`.", rust="ergo-validation/src/voting/", layer="L4,L5", state="OPEN", tests=[], note="OPEN: need JVM epoch-transition fixture with approved negative/positive votes, including current maxBlockCost 16384 and 16385, and step max(1,current/100); 16384 is a threshold on current value, not a proposed-value clamp. L2 verify receives a scalar limit, never Parameters.update or votes. Existing synthetic fixed-parameter block fixtures and ordinary replay ranges do not prove lowering across the threshold."},
