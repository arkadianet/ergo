  {id="METHOD-box-registers-R0-R3", cat="METHOD", scala="data/shared/src/main/scala/sigma/ast/methods.scala:1277", rust="unverified", layer="L1,L2", state="CLOSED", tests=["ergo-sigma::it::cost_ledger_fixtures::cost_ledger_fixtures_jvm_verify_fields_match"], note="Closed on verdict and failure-class parity per controller ruling: fixtures/method/box-registers.json.gz probes direct R0..R3 / IDs 9..12, empty/full optional registers and ten prefixes (200 cases across both rows). Both implementations reject at evaluation; JVM java.lang.NoSuchMethodException maps only unsupported SBox PropertyCall IDs 9..18, backed by methods.scala:1273 generated IR methods and values.scala:1348 reflection dispatch. JVM eval/total unavailable, so cost components are not compared per design section 4; no claim of an observed 50-JIT accessor charge. Mandatory R0..R3 cannot be absent from a valid box."},
