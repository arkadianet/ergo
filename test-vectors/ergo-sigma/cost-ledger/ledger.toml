  {id="TX-verifier-failure-sentinel-T009", cat="TX", scala="ergo-core/src/main/scala/org/ergoplatform/modifiers/mempool/ErgoTransaction.scala:140", rust="unverified", layer="L3,L5", state="OPEN", tests=[], note="OPEN: ErgoTransaction.scala maps verifier Failure to (false,maxCost+1), then validates script and accumulated cost. L2 verify returns Failure directly and cannot expose the transaction-local sentinel. Existing failed-proof sweeps do not distinguish Success(false,cost) from Failure or observe the sentinel. Need JVM transaction observer for a throwing verifier plus maxCost+1, rejection class and unavailable accepted execution cost; never treat this sentinel as an accepted cost."},
