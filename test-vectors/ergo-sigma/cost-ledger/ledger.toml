  {id="BLOCK-overflow", cat="BLOCK", scala="ergo-core/src/main/scala/org/ergoplatform/modifiers/mempool/ErgoTransaction.scala:370; addExact/multiplyExact throw ArithmeticException → block invalid", rust="typed JitCostOverflow / saturating init arithmetic", layer="L5", state="N-A", tests=[], note="N-A (controller ruling 2026-09-16, Task 6.3 family g): ErgoTransaction.validateStateful initialCost uses addExact/multiplyExact over Int operands widened to Long (collection sizes and parameter tariffs are Int), so no single product or the four-term sum can overflow Long; the overflow branch is unreachable from any serialisable transaction. Rust uses saturating arithmetic on the same bounded inputs, bit-identical on every reachable value (costing.md §11.1). Both sides would reject, not accept, if ever reached."},
