  {id="TX-l4-range-voted-params", cat="TX", scala="ergo v6.0.5 src/main/scala/org/ergoplatform/settings/Parameters.scala; test-vectors/scripts/scala/ComputeTransactionCosts.scala historical epoch parameters", rust="ergo-validation/tests/it/cost_parity.rs::ranges::run_range", layer="L4", state="N-A", tests=[], note="Runner defect fixed in task 5.4, not a production tariff divergence. Historical epoch extensions now supply each transaction context and ProtocolParams::from_active, including the accumulator limit. All ten original ranges execute all 64273 selected transactions and match JVM breakdowns. CLOSED evidence is TX-voted-params. Original eight-delta evidence is preserved in results/l4-2026-09-16-task-5.1.json; fresh full selection records separate reject-valid cases without baselining."},
  {id="TX-l4-v6-activation-reject-valid", cat="TX", scala="Ergo 6.0.5 ErgoTransaction.validateStateful; sigma-state 6.0.6; test-vectors/scripts/scala/ComputeTransactionCosts.scala", rust="ergo-sigma/src/reduce.rs::verify_spending_proof_with_context_and_cost", layer="L4", state="CLOSED", tests=["ergo-validation::it::cost_parity::transaction_v6_activation_spends_match_jvm"], note="Reject-valid regression fixed by preserving the empty MapCollection result type for box.tokens(0)._1. Missing SelectField, ByIndex and SBox.tokens static inference produced Coll[SAny]; the element-type equality gate introduced in 92cbd1815 then returned false against Coll[Coll[Byte]]. Node and replay contexts match (tree version 1, activation 3). Both frozen mainnet transactions now match JVM acceptance and all input/init/token/total costs (23851 and 23925). JVM verify reductions independently reproduce true at eval 440/514, crypto 0; see cost-total/l4-v6-reduction-evidence.json. Fix: task 0.9, preserve token projection types so valid empty maps compare correctly. Production binary dated September 7 predates the September 16 equality gate; retained logs do not prove validation at these exact heights."},
