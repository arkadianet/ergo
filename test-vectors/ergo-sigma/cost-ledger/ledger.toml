  {id="VERSION-jit-activation", cat="VERSION", scala="ergo-core/src/main/scala/org/ergoplatform/modifiers/history/header/Header.scala:142 Interpreter50Version = 3: JIT costing active from BLOCK version 3 (v5.0), activatedScriptVersion 2; HardeningVersion = 2 is the 4.0 hard fork; Interpreter60Version = 4", rust="ergo-validation/src/context.rs:164 activated_script_version", layer="L4", state="CLOSED", tests=["ergo-validation::it::cost_parity::transaction_activation_boundaries_match_jvm"], note="Mainnet headers locate v2 at 417792, block v3/JIT at 889856 and block v4 at 1628160. Frozen JVM observations immediately before/at/after all three transitions match Rust field by field. The oracle explicitly calls validateStateful and re-verifies even pre-v3 transactions; checkpoint bypass is separately pinned by TX-scripts-skipped-pairing. Full plus/minus 1024 coverage executed; two later v6 reject-valid spends are tracked separately, not baselined."},
  {id="VERSION-pre-v3-upcast", cat="VERSION", scala="data/shared/src/main/scala/sigma/ast/SigmaBuilder.scala:750; applyUpcast only for ErgoTree version < 3", rust="ergo-sigma/src/evaluator/opcodes/cast.rs:75", layer="L2,L4", state="CLOSED", tests=["ergo-validation::it::cost_parity::transaction_activation_boundaries_match_jvm", "ergo-sigma::it::cost_ledger_fixtures::cost_ledger_fixtures_jvm_verify_fields_match"], note="JVM 6.0.2 verify: fixtures/version/upcast-v2{,-wide}.json.gz and upcast-v3{,-wide}.json.gz. Identical mixed Byte/Long Plus body: v2 inserts Upcast (one extra block unit versus matched Long operands at all ten boundary prefixes); v3 charges then throws ClassCastException. Matched-width controls accept at both versions; v3 failure observations and budget sweeps are JVM-derived. L4 additionally pins JVM mainnet before/at/after block-version activations via activation-boundaries.json.gz; mixed-width upcast semantics remain independently covered by L2 fixtures."},
  {id="VERSION-v3-bool-root", cat="VERSION", scala="data/shared/src/main/scala/org/ergoplatform/validation/ValidationRules.scala:40-50; rule 1001 CheckDeserializedScriptIsSigmaProp rejects any non-SigmaProp root for ALL tree versions; applied with checkType on the consensus path at data/shared/src/main/scala/sigma/serialization/ErgoTreeSerializer.scala:173", rust="ergo-ser/src/ergo_tree/type_infer.rs", layer="L2", state="CLOSED", tests=["ergo-sigma::it::cost_ledger_fixtures::cost_ledger_fixtures_jvm_verify_fields_match"], note="JVM 6.0.2 parser: fixtures/version/bool-root.json.gz. Size-delimited v3 Boolean root retains rule-1001 ValidationException; parse_only forces that retained failure without Interpreter.verify. Both adapters report RejectScript with all cost fields unavailable (no evaluation). No Bool-to-SigmaProp root coercion."},
