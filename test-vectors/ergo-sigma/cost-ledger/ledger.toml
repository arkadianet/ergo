  {id="VERSION-tree-version-gate", cat="VERSION", scala="interpreter/shared/src/main/scala/sigmastate/interpreter/Interpreter.scala:304; tree version > activated within supported versions → REJECT; future-version bypass only when both activated and tree versions exceed the supported maximum (checkSoftForkCondition / trySoftForkable)", rust="ergo-sigma/src/reduce.rs; ergo-validation/src/context.rs; ergo-validation/src/tx/script/mod.rs", layer="L4", state="CLOSED", tests=["ergo-sigma::it::cost_ledger_fixtures::cost_ledger_fixtures_jvm_verify_fields_match","ergo-validation::it::cost_sweeps::validation_settings_activated_script_inputs_match_jvm","ergo-validation::it::cost_parity::cost_parity_activated_statuses_match_mainnet_bytes","ergo-validation::it::cost_parity::cost_parity_required_selection_matches_jvm"], note="Activated cumulative statuses now reach production transaction script verification through ProtocolParams::from_active and ReductionContext. gate-soft-fork.json.gz and validation-settings.json.gz pin recognized rule-1000 fallback: eval 10, crypto 0, total 27 with init 17; JIT limit 27 rejects, 28 accepts. Supported tree-version rejection remains ahead of fallback; future-version bypass controls remain consumed. Mainnet replay reads real prefix-0x02 statuses and retains 101187 executed / 0 failures."},
