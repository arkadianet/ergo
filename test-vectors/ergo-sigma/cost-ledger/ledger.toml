# JIT-cost conformance ledger — AUTHORITATIVE (LEDGER.md is rendered from this file).
#
# One row per Scala cost obligation on the block-validation path. A row is CLOSED only
# when a named test, backed by an independent oracle (JVM extract, JVM verdict, or
# mainnet bytes), passes and carries a `// ledger: <id>` comment. Tests whose expected
# value is computed by Rust code cannot close a row.
#
# Categories: OP (opcode costKind), METHOD (SMethod cost), EVAL (evaluator charge not a
# costKind), INTERP (Interpreter-level), TX (ErgoTransaction-level), BLOCK (state-level),
# ORDER (charge-order deviation to prove verdict-neutral), ROUND (truncation/snap),
# LIMIT (comparison against a budget), VERSION (activation/version branch).
# States: OPEN | CLOSED | DIVERGENT | N-A (N-A needs a reviewed rationale in `note`).
# Layers: L1 source pin, L2 per-op JVM fixture, L3 boundary sweep, L4 mainnet replay,
# L5 block fixture, L6 mixed devnet.
#
# Scala anchors: sigmastate v6.0.2 (23dd29f6) and ergo v6.0.2 (2cdbb8cf). Paths are
# relative to those checkouts. Line numbers are filled by the L1 extractor task; rows
# created from the Rust side carry the Scala symbol name until then.
#
# Rust anchors: this repo at the ledger's last-updated commit.

