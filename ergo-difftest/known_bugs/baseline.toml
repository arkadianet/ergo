# Accepted baseline for the standing consensus guard (scripts/difftest-guard.sh).
#
# Historical tracked entries are preserved below. Their 16-character input
# identities do not bind source/context/reference authority and cannot mute
# new authority-bound records. They are reported as stale until reviewed.
#
# New entries use the semantic key stored in record.execution.baseline_key:
#     key = "<surface>/<64-character semantic SHA-256>"
# It binds surface, kind, input, verdicts and the validated comparison contract.
# The immutable JSON filename separately hashes the complete record, preserving
# iteration, processing errors and execution evidence without overwrites.
# Never infer current main-branch behavior from these historical entries alone.
#
# RULES
#  * `ref` is REQUIRED and must match `(PR|issue) #<number>`. An entry without a
#    tracking reference is not a baseline, it is a divergence somebody muted.
#  * When the referenced fix merges, DELETE the entry. The guard going red on
#    the next run is the signal that the fix did not actually close the class.
#  * Never add an entry to make a run green. Add it because a human read the
#    minimized record, understood the divergence, and filed it.

# ---------------------------------------------------------------------------
# PR #301 — a non-Constant EvaluatedValue in an input's context extension.
# The node's `read_context_extension` reads a Constant only, so it rejects a
# transaction the reference mines: a reject-valid stall. One class, three
# surfaces (the same minimized transaction reaches `transaction` and `validate`;
# `reduce_ctx` carries the frame form).
#
# NOTE: all three triggers are `0x85`, the BOOL-PACKED ConcreteCollection. #301's
# deserializer split admits `0x83` and `0x86` by name; `0x85` is the same
# `EvaluatedValue`. If the fix lands without it, these entries stay red — which
# is the correct outcome, not a reason to re-baseline them.
# ---------------------------------------------------------------------------
[[baseline]]
key  = "transaction/f5ae47e008aaa2a6"
ref  = "PR #301"
note = "ctx-extension 0x85 in a 1-in/1-out tx: rust Reject(unknown type code: 0x85) vs jvm ACCEPT byte-exact."

[[baseline]]
key  = "validate/f5ae47e008aaa2a6"
ref  = "PR #301"
note = "Same transaction as above reaching statelessValidity: the reject happens at parse, before any structural rule."

[[baseline]]
key  = "reduce_ctx/9dcf5061b61a535c"
ref  = "PR #301"
note = "contextExtension·ergoBoxCandidate frame carrying 0x85 and 0x83 extension values: rust Reject(extension: ...) vs jvm ACCEPT P:d3|5."

# ---------------------------------------------------------------------------
# Issue #312 — the register twin of #301, NOT covered by that PR.
# ---------------------------------------------------------------------------
[[baseline]]
key  = "ergo_box_candidate/ef25eeb513cc52ed"
ref  = "issue #312"
note = "GroupGenerator (0x82) in R4/R6: rust Reject(unsupported expression opcode 0x82 in register value) vs jvm ACCEPT byte-exact. Persists on the reduce_ctx reduction channel."
