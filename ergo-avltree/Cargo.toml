[package]
name        = "ergo-avltree"
description = "Authenticated AVL+ tree (batch prover and verifier) for the Ergo Rust node, vendored from ergoplatform/ergo_avltree_rust."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish    = false
authors    = ["Konstantin Knizhnik <knizhnik@garret.ru>", "Ross Weir"]

# Dependency versions are upstream's (ergo_avltree_rust 9231458), not the
# workspace's, so the vendored code builds against what it was written for.
[dependencies]
bytes     = { version = "1.0.1", default-features = false }
rand      = { version = "0.8.3", default-features = false }
blake2    = { version = "0.10.6", default-features = false }
anyhow    = { version = "1.0", default-features = false }
byteorder = { version = "1.4.3", default-features = false }
base16    = { version = "0.2.1", default-features = false, features = ["alloc"] }
sha2      = { version = "0.9.8", default-features = false }

[dev-dependencies]
rand = { version = "0.8.3", features = ["std"] }
# The crates.io release this crate replaced, for tests/differential_0_1_1.rs.
ergo_avltree_rust_0_1_1 = { package = "ergo_avltree_rust", version = "=0.1.1" }

[lints]
workspace = true
