name: Release binaries

# Triggered by pushing a tag of the form `v*` (e.g. `v0.3.0`), or manually via
# workflow_dispatch with a `tag` input. Builds ergo-node + ergo-wallet for
# Linux (glibc + static musl), macOS, and Windows on x86_64, plus native
# Linux glibc and macOS ARM64. For each platform
# it packages one combined `.tar.gz` / `.zip` archive (both programs + README +
# config + operating docs + licenses). Publication validates all six receipts,
# then uploads only those archives, SHA256SUMS and release.json (eight assets).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build + publish (e.g. v0.3.0)'
        required: true
        type: string

# Publication is conditional on validation and smoke checks of one resolved
# commit. All jobs read it by SHA; tags are checked again before publication.
permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve release tag to exact commit
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require tag and workspace version to agree
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: python scripts/release.py resolve --github-output

  validate:
    name: Validate exact release commit
    needs: resolve
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}

  validate-cost-ledger:
    name: Validate exact release cost ledger
    needs: resolve
    uses: ./.github/workflows/cost-ledger.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}

  build:
    name: Build and smoke-test ${{ matrix.target }}
    needs: [resolve, validate, validate-cost-ledger]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false

      - uses: ./.github/actions/rust
        id: rust
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: release-${{ matrix.target }}

      - name: Build release binaries
        run: cargo build --locked --release --bin ergo-node --bin ergo-wallet --target ${{ matrix.target }}

      - name: Package combined archive and test both extracted binaries
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
        run: python scripts/release.py package --target ${{ matrix.target }} --binaries target/${{ matrix.target }}/release --output release-artifacts

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: |
            release-artifacts/public/*
            release-artifacts/internal/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [resolve, validate, validate-cost-ledger, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          pattern: release-*

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: src

      - name: Reject moved release tags
        working-directory: src
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
        run: python scripts/release.py verify

      - name: Aggregate and verify exactly eight public assets
        working-directory: src
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          python scripts/release.py aggregate --input ../artifacts --output ../public
          python scripts/release.py verify-assets --input ../public

      # The release body is the tag's CHANGELOG section. An existing non-empty body is
      # never replaced, so notes edited by hand survive a re-run; a missing section only
      # warns, because it must not block publishing the binaries.
      - name: Release notes from CHANGELOG
        id: notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          existing=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body 2>/dev/null || true)
          if [ -n "$existing" ]; then
            echo "path=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version="${TAG#v}"
          awk -v h="## [$version]" 'index($0, h) == 1 { on = 1; next } on && /^## \[/ { exit } on' \
            src/CHANGELOG.md > release-notes.md
          if grep -q '[^[:space:]]' release-notes.md; then
            echo "path=release-notes.md" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::CHANGELOG.md has no section for $version; publishing without release notes"
            echo "path=" >> "$GITHUB_OUTPUT"
          fi

      - name: Refuse changes to existing published assets
        working-directory: src
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: python scripts/release.py verify-published --input ../public

      - name: Recheck source and public assets immediately before publication
        working-directory: src
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          python scripts/release.py verify-assets --input ../public
          python scripts/release.py verify

      - name: Create / update release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          name: ${{ needs.resolve.outputs.tag }}
          # Pre-1.0 releases are pre-release only when the tag carries an
          # -alpha / -beta / -rc suffix.
          prerelease: ${{ contains(needs.resolve.outputs.tag, '-') }}
          body_path: ${{ steps.notes.outputs.path }}
          overwrite_files: false
          fail_on_unmatched_files: true
          files: public/*
