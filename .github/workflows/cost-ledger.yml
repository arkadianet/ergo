name: Cost ledger

on:
  workflow_call:
    inputs:
      ref:
        description: Exact commit to validate for a release
        type: string
        required: false
        default: ''
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ledger-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          # Artifact provenance verification reads the recorded generator commit.
          fetch-depth: 0
          persist-credentials: false
      - name: Ledger checker self-tests
        run: |
          python3 scripts/cost-ledger.py --selftest
          python3 -m unittest discover -s scripts -p 'test_cost_ledger_evidence.py'
          python3 -m unittest discover -s scripts -p 'test_l4_*.py'
          python3 -m unittest discover -s scripts -p 'test_oracle_tools.py'
      - name: JVM artifact integrity
        run: python3 scripts/jvm_cost_constants_extractor/verify.py
      - name: Ledger integrity
        run: python3 scripts/cost-ledger.py check
      - name: Inventory diff self-tests
        run: python3 scripts/cost-ledger-diff.py --selftest
      - name: Inventory diff (enumeration vs ledger must be empty)
        run: python3 scripts/cost-ledger-diff.py

  tracked-cost-fixtures:
    runs-on: ubuntu-latest
    env:
      COST_LEDGER_TEST_RESULTS: target/cost-ledger-test-results.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/rust
        id: rust
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: cost-ledger
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2
        with:
          tool: cargo-nextest@${{ steps.rust.outputs.nextest }}
      - name: Tracked cost fixtures
        env:
          NEXTEST_NO_TESTS: warn
        run: cargo nextest run --locked -p ergo-sigma -p ergo-validation -E 'test(/cost_(pin|ledger_fixtures|sweeps|block_fixtures|crypto_truncation)/)'
      - name: Fetch the L4 replay inputs (hash-pinned data release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/fetch-l4-inputs.sh
      - name: Record workspace passing evidence
        run: python3 scripts/cost_ledger_evidence.py
      - name: Validate closure evidence
        if: ${{ always() && !cancelled() }}
        run: |
          test -f "$COST_LEDGER_TEST_RESULTS"
          python3 scripts/cost-ledger.py check --strict
