name: Cost ledger

on:
  workflow_call:
    inputs:
      ref:
        description: Exact commit to validate for a release
        type: string
        required: false
        default: ''
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ledger-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          # Artifact provenance verification reads the recorded generator commit.
          fetch-depth: 0
          persist-credentials: false
      - name: Ledger checker self-tests
        run: python3 scripts/cost-ledger.py --selftest
      - name: JVM artifact integrity
        run: python3 scripts/jvm_cost_constants_extractor/verify.py
      - name: Ledger integrity
        run: python3 scripts/cost-ledger.py check
      - name: Inventory diff self-tests
        run: python3 scripts/cost-ledger-diff.py --selftest
      - name: Inventory diff (enumeration vs ledger must be empty)
        run: python3 scripts/cost-ledger-diff.py

  tracked-cost-fixtures:
    runs-on: ubuntu-latest
    env:
      COST_LEDGER_TEST_RESULTS: target/cost-ledger-test-results.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/rust
        id: rust
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          key: cost-ledger
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2
        with:
          tool: cargo-nextest@${{ steps.rust.outputs.nextest }}
      - name: Tracked cost fixtures
        env:
          NEXTEST_NO_TESTS: warn
        run: cargo nextest run --locked -p ergo-sigma -p ergo-validation -E 'test(/cost_(pin|ledger_fixtures|sweeps|block_fixtures|crypto_truncation)/)'
      - name: Fetch the L4 replay inputs (hash-pinned data release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/fetch-l4-inputs.sh
      - name: Record workspace passing evidence
        env:
          # libtest-json is experimental and makes --message-format mandatory, so it is
          # scoped to this step only; the fixture step above runs nextest in its default mode.
          NEXTEST_EXPERIMENTAL_LIBTEST_JSON: "1"
          NEXTEST_MESSAGE_FORMAT_VERSION: "0.1"
        run: |
          mkdir -p target
          # Closing tests for the L4 rows live behind ergo-validation's `diagnostics`
          # feature (the mainnet replay), so a default-feature run would report them
          # as missing passing evidence. Only that feature: --all-features would also
          # enable live-node oracle tests that need a running Scala node. The same
          # feature gates operator-only diagnostics that read local REST captures
          # (diagnose_block_*, trace_*, parity_triage, eval_error_triage); those are
          # excluded here and are not closing evidence for any row.
          cargo nextest run --locked --workspace --features ergo-validation/diagnostics --no-fail-fast \
            -E 'not (binary(/^diagnose_block_/) | binary(/^trace_/) | binary(parity_triage) | binary(eval_error_triage))' \
            --message-format libtest-json > "$COST_LEDGER_TEST_RESULTS"
      - name: Validate closure evidence
        if: ${{ always() && !cancelled() }}
        run: |
          test -f "$COST_LEDGER_TEST_RESULTS"
          python3 scripts/cost-ledger.py check
