name: Fuzz (nightly scheduled)

# Nightly long campaign: structure-aware generators + corpus mutation.
# This job is NOT gating (PRs land without waiting for it). It runs a longer
# campaign to build coverage, grows the committed seed corpus over time, and
# surfaces new invariant violations as loud failures.
#
# Note on cargo-fuzz / libFuzzer: the cargo-fuzz targets in
# ergo-difftest/fuzz/ require a nightly toolchain and are intentionally NOT
# part of this stable job. The hermetic structured campaign below is the stable
# equivalent — same fuzz_one logic, coverage-guided by the structure-aware
# generators rather than by libFuzzer instrumentation. See D1 in
# ergo-difftest/docs/interface-contracts.md §6 for the design rationale.
#
# The JVM oracle differential requires scala-cli + a published local ergo-core
# and stays manual/local. The streamed replay driver IS wired below (the `replay`
# job) but is gated on a `REPLAY_NODE_URL` secret pointing at a reachable archival
# Scala node — it no-ops when unset (GitHub-hosted runners have no node), so it
# runs on a self-hosted runner or an operator `workflow_dispatch`. This is where
# the deep contiguous state-root coverage retired from committed fixtures now
# lives (see test-vectors/mainnet/FIXTURES.md).

on:
  schedule:
    # 02:00 UTC every night (off-peak for cache efficiency)
    - cron: '0 2 * * *'
  workflow_dispatch:
    # Allow manual trigger for an on-demand long campaign, and for the
    # JVM-oracle `consensus-guard` job (which only runs on this event — see
    # the job's own comment for why it is not on the nightly schedule).
    inputs:
      runner:
        description: 'Runner label for consensus-guard (self-hosted recommended)'
        required: false
        default: 'ubuntu-latest'
      guard_seed:
        description: 'consensus-guard PRNG seed'
        required: false
        default: '991'
      guard_iters:
        description: 'consensus-guard iterations per surface'
        required: false
        default: '2000'

# Least privilege: fuzz jobs read the repo + upload artifacts; no write to contents.
permissions:
  contents: read

jobs:
  fuzz-structured:
    name: structured campaign (2 000 000 iters, min-coverage 0.80)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0

      # Keep the difftest binary cached across nightly runs so only dependency
      # changes trigger a rebuild (the generator code rarely changes).
      - uses: Swatinem/rust-cache@v2
        with:
          key: fuzz-nightly

      - name: cargo build (release)
        run: cargo build --release -p ergo-difftest

      # Long structured campaign (2 M iters ≈ 10–15 min on ubuntu-latest).
      # Fails loudly on any invariant violation OR coverage drop below 80 %.
      - name: structured campaign — 2 000 000 iters
        run: |
          cargo run --release -p ergo-difftest -- \
            --structured --iters 2000000 --min-coverage 0.80

  fuzz-corpus-mutation:
    name: corpus mutation campaign (2 000 000 iters)
    runs-on: ubuntu-latest
    # Independent of fuzz-structured — a separate signal, runs in parallel.
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0

      - uses: Swatinem/rust-cache@v2
        with:
          key: fuzz-corpus-mutation

      - name: cargo build (release)
        run: cargo build --release -p ergo-difftest

      # Byte-mutation campaign seeded from the committed corpus.
      # Unlike the structured campaign (grammar-aware), this mutates real wire
      # bytes — catching decoding bugs near the valid manifold.
      - name: corpus mutation — 2 000 000 iters
        run: |
          cargo run --release -p ergo-difftest -- \
            --iters 2000000 \
            --corpus ergo-difftest/fuzz/corpus/ergo_tree

      # Run ergo_tree and sigma_expr surfaces with the full corpus.
      # Other surfaces use the default unstructured random (no --corpus flag).
      - name: corpus mutation (sigma_expr) — 500 000 iters
        run: |
          cargo run --release -p ergo-difftest -- \
            --surface sigma_expr --iters 500000 \
            --corpus ergo-difftest/fuzz/corpus/sigma_expr

  replay:
    name: streamed archival replay (deep contiguous state-root)
    runs-on: ubuntu-latest
    # Reproduces the deep contiguous coverage retired from committed fixtures.
    # Requires a reachable archival Scala node via the REPLAY_NODE_URL secret;
    # no-ops when unset (GitHub-hosted runners have no node — use a self-hosted
    # runner or a workflow_dispatch from an operator with node access).
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0

      - uses: Swatinem/rust-cache@v2
        with:
          key: replay-driver

      - name: cargo build (release)
        run: cargo build --release -p ergo-difftest --bin replay

      # Pass the node URL via env (a secret) — never interpolated into the shell.
      # Skip cleanly when unset so the job is green on hosted runners without a node.
      - name: streamed replay 1..10000 (verifies pins by hash, diffs state roots)
        env:
          REPLAY_NODE_URL: ${{ secrets.REPLAY_NODE_URL }}
        run: |
          if [ -z "$REPLAY_NODE_URL" ]; then
            echo "REPLAY_NODE_URL unset — skipping streamed replay (needs a live archival node)."
            exit 0
          fi
          cargo run --release -p ergo-difftest --bin replay -- \
            --from 1 --to 10000 --node "$REPLAY_NODE_URL"

  cargo-fuzz-nightly:
    name: cargo-fuzz (nightly, libFuzzer + ASan)
    runs-on: ubuntu-latest
    # Coverage-guided libFuzzer fuzzing — requires nightly (SanitizerCoverage +
    # ASan are unstable -Z features; see D1 in interface-contracts.md §6). This
    # is the deeper, non-gating complement to the stable structured campaign: it
    # reaches inputs bounded fuzzing misses. A bounded run per surface keeps the
    # nightly runtime sane; crash artifacts and the grown corpus are uploaded
    # for triage / re-seeding.
    strategy:
      fail-fast: false
      matrix:
        target: [ergo_tree, constant, ergo_box_candidate, transaction, header, sigma_expr]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: rust-src

      - uses: Swatinem/rust-cache@v2
        with:
          key: cargo-fuzz-${{ matrix.target }}
          workspaces: ergo-difftest/fuzz

      # Cache the installed cargo-fuzz binary itself (not just its build deps)
      # across nightly runs — it changes rarely.
      - name: cache cargo-fuzz binary
        id: cargo-fuzz-bin-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-fuzz
          key: cargo-fuzz-bin-${{ runner.os }}-v0.13

      - name: install cargo-fuzz
        if: steps.cargo-fuzz-bin-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-fuzz --locked

      # Bounded run: build (ASan) + a coverage-guided run seeded from the
      # committed corpus/<surface>, capped at 10 minutes wall-clock per target
      # (fail-fast: false means one target's crash doesn't stop the others).
      # -error_exitcode=1 makes a real crash fail the job (actionable red);
      # the type-depth guard artifact is already filtered out of the Bug class
      # (SER-003) so it will not spuriously fail this.
      - name: fuzz ${{ matrix.target }} (bounded run, 10 min)
        working-directory: ergo-difftest
        run: |
          cargo +nightly fuzz run "${{ matrix.target }}" -- \
            -max_total_time=600 -error_exitcode=1

      - name: upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: ergo-difftest/fuzz/artifacts/
          if-no-files-found: ignore

      # Always upload the (possibly grown) corpus, win or lose, so an operator
      # can review new coverage-adding inputs and fold curated ones back into
      # the committed corpus/<surface>/ by hand.
      - name: upload grown corpus
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-corpus-${{ matrix.target }}
          path: ergo-difftest/fuzz/corpus/${{ matrix.target }}/
          if-no-files-found: ignore

  consensus-guard:
    name: consensus guard (JVM oracle differential — reduce / reduce_ctx / tx / box / validate)
    # `workflow_dispatch` ONLY, deliberately — not on the nightly schedule.
    #
    # Why: the oracle runs the REAL reference jars, and `ergo-core 6.0.2` is not
    # published to Maven Central. Standing it up on a cold GitHub-hosted runner
    # means cloning the Scala node and running
    # `sbt avldb/publishLocal ergoWallet/publishLocal ergoCore/publishLocal`,
    # which alone exceeds the ~20 min this job is budgeted for (an sbt cold start
    # plus three subproject publishes; the coursier + sigma-state fetch is on top).
    # The `~/.ivy2/local` cache below removes that cost on a WARM runner, so the
    # honest wiring is: green-path = a self-hosted runner (or a hosted runner
    # whose ivy cache is already populated), triggered on demand or by an
    # operator cron; the bootstrap step is here so a cold run still works, just
    # slowly. Point `runner` at a self-hosted label to take the fast path.
    #
    # The hermetic PR-time `difftest` job in ci.yml is unchanged and needs none
    # of this.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0

      - uses: Swatinem/rust-cache@v2
        with:
          key: consensus-guard

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - uses: VirtusLab/scala-cli-setup@v1

      # The oracle's dependency closure: sigma-state 6.0.2 from Maven (coursier)
      # and ergo-core 6.0.2 from a local publish (ivy). Keyed on the oracle
      # script itself plus the pinned reference tag, so an oracle change or a
      # version bump invalidates the cache instead of silently reusing stale jars.
      - name: cache JVM oracle dependencies
        id: oracle-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.ivy2/local
            ~/.cache/coursier
          key: jvm-oracle-${{ hashFiles('scripts/jvm_serde_oracle/ErgoSerdeOracle.scala') }}-ergo-core-6.0.2

      # Cold path only: publish ergo-core 6.0.2 locally. `avldb` pulls
      # leveldbjni-all from the GitLab repo the .scala `using repository`
      # directive already declares, so no extra resolver config is needed here.
      - name: bootstrap ergo-core 6.0.2 (publishLocal)
        if: steps.oracle-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v6.0.2 https://github.com/ergoplatform/ergo.git "$RUNNER_TEMP/ergo-reference"
          cd "$RUNNER_TEMP/ergo-reference"
          sbt "avldb/publishLocal" "ergoWallet/publishLocal" "ergoCore/publishLocal"

      # Warm the oracle before timing anything: the first query compiles the
      # script and resolves dependencies, and a failure here is an ENVIRONMENT
      # failure, not a consensus finding — surface it as its own red step.
      - name: warm the JVM oracle
        run: |
          set -euo pipefail
          echo "ergo_tree 0008d3" \
            | scala-cli run scripts/jvm_serde_oracle/ErgoSerdeOracle.scala \
            | tee /tmp/oracle-warm.txt
          grep -q '^ACCEPT 0008d3$' /tmp/oracle-warm.txt

      - name: cargo build (release)
        run: cargo build --release -p ergo-difftest

      # The guard itself. Exits non-zero on any PENDING divergence — a
      # reduce-native finding, or a parse-surface finding that PERSISTS on its
      # reduction channel. KnownArtifact records are reported and ignored.
      - name: consensus guard
        env:
          DIFFTEST_ORACLE_LOG: ${{ runner.temp }}/oracle-transcript.log
        run: |
          scripts/difftest-guard.sh \
            --seed "${{ inputs.guard_seed || '991' }}" \
            --iters "${{ inputs.guard_iters || '2000' }}"

      # Always upload: on a pass this is the empty-queue evidence, on a failure
      # it is the minimized, classified record set plus the oracle transcript
      # that proves the harness and the oracle stayed in step.
      - name: upload regressions + oracle transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: consensus-guard-regressions
          path: |
            ergo-difftest/regressions/
            ${{ runner.temp }}/oracle-transcript.log
          if-no-files-found: ignore
