name: Fuzz (nightly scheduled)

# Nightly long campaign: structure-aware generators + corpus mutation.
# This job is NOT gating (PRs land without waiting for it). It runs a longer
# campaign to build coverage, grows the committed seed corpus over time, and
# surfaces new invariant violations as loud failures.
#
# The structured and mutation campaigns use stable Rust; cargo-fuzz runs in
# a separate nightly-toolchain matrix with libFuzzer and ASan instrumentation.
#
# The JVM oracle differential runs on the same nightly schedule, with cached
# reference jars and an optional warm runner selected by CONSENSUS_GUARD_RUNNER.
# The streamed replay driver IS wired below (the `replay`
# job) but is gated on a `REPLAY_NODE_URL` secret pointing at a reachable archival
# Scala node — it no-ops when unset (GitHub-hosted runners have no node), so it
# runs on a self-hosted runner or an operator `workflow_dispatch`. This is where
# the deep contiguous state-root coverage retired from committed fixtures now
# lives (see test-vectors/mainnet/FIXTURES.md).

on:
  schedule:
    # 02:00 UTC every night (off-peak for cache efficiency)
    - cron: '0 2 * * *'
  workflow_dispatch:
    # Manual runs can reproduce a recorded seed on a selected runner.
    inputs:
      runner:
        description: 'Runner label (empty uses CONSENSUS_GUARD_RUNNER or ubuntu-latest)'
        required: false
        default: ''
      guard_seed:
        description: 'consensus-guard PRNG seed'
        required: false
        default: '991'
      guard_iters:
        description: 'consensus-guard iterations per surface'
        required: false
        default: '2000'

# Least privilege: fuzz jobs read the repo + upload artifacts; no write to contents.
permissions:
  contents: read

jobs:
  fuzz-structured:
    name: structured campaign (2 000 000 iters, min-coverage 0.80)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/rust
        id: rust

      # Keep the difftest binary cached across nightly runs so only dependency
      # changes trigger a rebuild (the generator code rarely changes).
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: fuzz-nightly

      - name: cargo build --locked (release)
        run: cargo build --locked --release -p ergo-difftest

      # Long structured campaign (2 M iters ≈ 10–15 min on ubuntu-latest).
      # Fails loudly on any invariant violation OR coverage drop below 80 %.
      - name: structured campaign — 2 000 000 iters
        run: |
          cargo run --locked --release -p ergo-difftest -- \
            --structured --iters 2000000 --min-coverage 0.80

  fuzz-corpus-mutation:
    name: corpus mutation campaign (2 000 000 iters)
    runs-on: ubuntu-latest
    # Independent of fuzz-structured — a separate signal, runs in parallel.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/rust
        id: rust

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: fuzz-corpus-mutation

      - name: cargo build --locked (release)
        run: cargo build --locked --release -p ergo-difftest

      # Byte-mutation campaign seeded from the committed corpus.
      # Unlike the structured campaign (grammar-aware), this mutates real wire
      # bytes — catching decoding bugs near the valid manifold.
      - name: corpus mutation — 2 000 000 iters
        run: |
          set -o pipefail
          cargo run --locked --release -p ergo-difftest -- \
            --iters 2000000 \
            --corpus ergo-difftest/fuzz/corpus/ergo_tree \
            2>&1 | tee "$RUNNER_TEMP/corpus-mutation.log"

      # Run ergo_tree and sigma_expr surfaces with the full corpus.
      # Other surfaces use the default unstructured random (no --corpus flag).
      - name: corpus mutation (sigma_expr) — 500 000 iters
        run: |
          set -o pipefail
          cargo run --locked --release -p ergo-difftest -- \
            --surface sigma_expr --iters 500000 \
            --corpus ergo-difftest/fuzz/corpus/sigma_expr \
            2>&1 | tee "$RUNNER_TEMP/sigma-expr-mutation.log"

      - name: upload mutation findings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-transcripts
          path: |
            ${{ runner.temp }}/corpus-mutation.log
            ${{ runner.temp }}/sigma-expr-mutation.log
          if-no-files-found: ignore

  replay:
    name: streamed archival replay (deep contiguous state-root)
    runs-on: ubuntu-latest
    # Reproduces the deep contiguous coverage retired from committed fixtures.
    # Requires a reachable archival Scala node via the REPLAY_NODE_URL secret;
    # no-ops when unset (GitHub-hosted runners have no node — use a self-hosted
    # runner or a workflow_dispatch from an operator with node access).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/rust
        id: rust

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: replay-driver

      - name: cargo build --locked (release)
        run: cargo build --locked --release -p ergo-difftest --bin replay

      # Pass the node URL via env (a secret) — never interpolated into the shell.
      # Skip cleanly when unset so the job is green on hosted runners without a node.
      - name: streamed replay 1..10000 (verifies pins by hash, diffs state roots)
        env:
          REPLAY_NODE_URL: ${{ secrets.REPLAY_NODE_URL }}
        run: |
          if [ -z "$REPLAY_NODE_URL" ]; then
            echo "REPLAY_NODE_URL unset — skipping streamed replay (needs a live archival node)."
            echo '### Archival replay was not tested' >> "$GITHUB_STEP_SUMMARY"
            echo 'REPLAY_NODE_URL is unset. Fuzzing results do not include state-root replay coverage.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          cargo run --locked --release -p ergo-difftest --bin replay -- \
            --from 1 --to 10000 --node "$REPLAY_NODE_URL"

  cargo-fuzz-nightly:
    name: cargo-fuzz (nightly, libFuzzer + ASan)
    runs-on: ubuntu-latest
    # Coverage-guided libFuzzer fuzzing — requires nightly (SanitizerCoverage +
    # ASan are unstable -Z features; see D1 in interface-contracts.md §6). This
    # is the deeper, non-gating complement to the stable structured campaign: it
    # reaches inputs bounded fuzzing misses. A bounded run per surface keeps the
    # nightly runtime sane; crash artifacts and the grown corpus are uploaded
    # for triage / re-seeding.
    strategy:
      fail-fast: false
      matrix:
        target: [ergo_tree, constant, ergo_box_candidate, transaction, header, sigma_expr, p2p_frame, p2p_handshake, p2p_message, p2p_delivery, compiler_source, bounded_evaluator]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/rust
        id: rust
        with:
          nightly: 'true'
          components: rust-src

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: cargo-fuzz-${{ matrix.target }}
          workspaces: ergo-difftest/fuzz

      # Cache the installed cargo-fuzz binary itself (not just its build deps)
      # across nightly runs — it changes rarely.
      - name: cache cargo-fuzz binary
        id: cargo-fuzz-bin-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-fuzz
          key: cargo-fuzz-bin-${{ runner.os }}-${{ steps.rust.outputs.fuzz }}

      - name: install cargo-fuzz
        if: steps.cargo-fuzz-bin-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-fuzz --version ${{ steps.rust.outputs.fuzz }} --locked

      # cargo-fuzz has no --locked option. Resolve its separate workspace
      # against the committed lock before building, then detect any drift even
      # when libFuzzer reports a crash.
      - name: check locked fuzz dependencies
        working-directory: ergo-difftest
        run: cargo +${{ steps.rust.outputs.nightly }} metadata --manifest-path fuzz/Cargo.toml --locked --format-version 1 > /dev/null

      # Bounded run: build (ASan) + a coverage-guided run seeded from the
      # committed corpus/<surface>, capped at 10 minutes wall-clock per target
      # (fail-fast: false means one target's crash doesn't stop the others).
      # -error_exitcode=1 makes a real crash fail the job (actionable red);
      # the type-depth guard artifact is already filtered out of the Bug class
      # (SER-003) so it will not spuriously fail this.
      - name: fuzz ${{ matrix.target }} (bounded run, 10 min)
        working-directory: ergo-difftest
        # ASan records the allocation stack of every malloc in a depot it never
        # frees. The recursive parsers produce new stacks with nearly every
        # input, so RSS grew ~330 B per execution (live heap ~33 MB) and
        # sigma_expr crossed the 2048 MB limit at ~6.5M executions. Without
        # allocation stacks RSS stays flat (~650 MB at 5.3M locally). A memory
        # error report then omits the alloc/free stacks: replay the uploaded
        # artifact locally with default ASAN_OPTIONS to get them back.
        env:
          ASAN_OPTIONS: malloc_context_size=0
        run: |
          cargo +${{ steps.rust.outputs.nightly }} fuzz run "${{ matrix.target }}" -- \
            -max_total_time=600 -error_exitcode=1 -rss_limit_mb=2048 -print_final_stats=1

      - name: verify fuzz lockfile unchanged
        if: always()
        run: |
          git ls-files --error-unmatch ergo-difftest/fuzz/Cargo.lock
          git diff --exit-code -- ergo-difftest/fuzz/Cargo.lock

      - name: upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: ergo-difftest/fuzz/artifacts/
          if-no-files-found: ignore

      # Always upload the (possibly grown) corpus, win or lose, so an operator
      # can review new coverage-adding inputs and fold curated ones back into
      # the committed corpus/<surface>/ by hand.
      - name: upload grown corpus
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-corpus-${{ matrix.target }}
          path: ergo-difftest/fuzz/corpus/${{ matrix.target }}/
          if-no-files-found: ignore

  consensus-guard:
    name: consensus guard (JVM oracle differential — reduce / reduce_ctx / tx / box / validate)
    # The oracle runs the REAL reference jars, and `ergo-core 6.0.6` is not
    # published to Maven Central. Standing it up on a cold GitHub-hosted runner
    # means cloning the Scala node and running
    # `sbt avldb/publishLocal ergoWallet/publishLocal ergoCore/publishLocal`,
    # (three subproject publishes, plus coursier and sigma-state dependency fetches).
    # The 120-minute timeout allows a cold run; the immutable-version dependency
    # cache removes this cost on subsequent hosted runs. Set the repository
    # variable CONSENSUS_GUARD_RUNNER to a warm runner label to reuse local jars.
    #
    # The hermetic PR-time `difftest` job in ci.yml is unchanged and needs none
    # of this.
    runs-on: ${{ inputs.runner || vars.CONSENSUS_GUARD_RUNNER || 'ubuntu-latest' }}
    concurrency:
      group: consensus-guard-${{ github.ref }}
      cancel-in-progress: false
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/rust
        id: rust

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: consensus-guard

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '11'

      - uses: VirtusLab/scala-cli-setup@c33dfbf1a5f16ee60efff453b7f9a987d2b6955b # v1

      # scala-cli does not install sbt, which the cold publishLocal path needs.
      - uses: sbt/setup-sbt@5ffaf2b6f207c2df06fee08e16bd6110e300b04d # v1
        with:
          sbt-runner-version: 1.12.11

      # The oracle's dependency closure: sigma-state 6.0.6 from Maven (coursier)
      # and ergo-core 6.0.6 from a local publish (ivy). Keyed on the oracle
      # script itself plus the pinned reference tag, so an oracle change or a
      # version bump invalidates the cache instead of silently reusing stale jars.
      - name: cache JVM oracle dependencies
        id: oracle-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.ivy2/local
            ~/.cache/coursier
          key: jvm-oracle-${{ hashFiles('scripts/jvm_serde_oracle/ErgoSerdeOracle.scala') }}-ergo-core-6.0.6

      # Cold path only: publish ergo-core 6.0.6 locally. `avldb` pulls
      # leveldbjni-all from the GitLab repo the .scala `using repository`
      # directive already declares, so no extra resolver config is needed here.
      - name: bootstrap ergo-core 6.0.6 (publishLocal)
        if: steps.oracle-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v6.0.6 https://github.com/ergoplatform/ergo.git "$RUNNER_TEMP/ergo-reference"
          cd "$RUNNER_TEMP/ergo-reference"
          sbt "avldb/publishLocal" "ergoWallet/publishLocal" "ergoCore/publishLocal"

      # Warm the oracle before timing anything: the first query compiles the
      # script and resolves dependencies, and a failure here is an ENVIRONMENT
      # failure, not a consensus finding — surface it as its own red step.
      - name: warm the JVM oracle
        run: |
          set -euo pipefail
          echo "ergo_tree 0008d3" \
            | scala-cli run scripts/jvm_serde_oracle/ErgoSerdeOracle.scala \
            | tee "$RUNNER_TEMP/oracle-warm.txt"
          grep -q '^ACCEPT 0008d3$' "$RUNNER_TEMP/oracle-warm.txt"

      - name: cargo build --locked (release)
        run: cargo build --locked --release -p ergo-difftest

      # The guard itself. Exit 1 = an UNBASELINED pending divergence (a new
      # candidate); exit 3 = the run did not check what it planned to (dead
      # oracle / short campaign), which is louder than a finding, not quieter.
      # Divergences already tracked in known_bugs/baseline.toml are printed in
      # their own table and do not fail the job.
      #
      # Inputs reach the shell through `env:`, never interpolated into `run:` —
      # `${{ }}` in a run body is textual substitution, so a crafted input value
      # would execute as script. The guard validates them as integers too.
      - name: consensus guard
        env:
          DIFFTEST_ORACLE_LOG: ${{ runner.temp }}/oracle-transcript.log
          # A scheduled run gets a recorded, rotating seed; manual runs retain
          # the explicit input so a failing campaign can be reproduced exactly.
          GUARD_SEED: ${{ inputs.guard_seed || github.run_id }}
          GUARD_ITERS: ${{ inputs.guard_iters || '2000' }}
        run: |
          set -euo pipefail
          printf 'seed=%s\niters=%s\nsource=%s\nreference=ergo-core-6.0.6\n' \
            "$GUARD_SEED" "$GUARD_ITERS" "$GITHUB_SHA" > "$RUNNER_TEMP/consensus-guard-run.txt"
          scripts/difftest-guard.sh --seed "$GUARD_SEED" --iters "$GUARD_ITERS" \
            --regressions-dir "$RUNNER_TEMP/consensus-guard-regressions" \
            2>&1 | tee "$RUNNER_TEMP/consensus-guard.log"

      - name: summarize consensus guard
        if: always()
        run: |
          {
            echo '### Scala consensus differential campaign'
            echo
            echo '```text'
            if [ -f "$RUNNER_TEMP/consensus-guard-run.txt" ]; then
              cat "$RUNNER_TEMP/consensus-guard-run.txt"
            else
              echo 'Campaign did not start; check dependency bootstrap and oracle warm-up.'
            fi
            echo '```'
            echo
            echo 'The artifact preserves the campaign log, seed, reference version, minimized regressions and per-surface oracle transcripts.'
          } >> "$GITHUB_STEP_SUMMARY"

      # Always upload: on a pass this is the empty-queue evidence, on a failure
      # it is the minimized, classified record set plus the oracle transcript
      # that proves the harness and the oracle stayed in step.
      - name: upload regressions + oracle transcript
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: consensus-guard-regressions
          path: |
            ${{ runner.temp }}/consensus-guard-regressions/
            ${{ runner.temp }}/consensus-guard-run.txt
            ${{ runner.temp }}/consensus-guard.log
            ${{ runner.temp }}/oracle-warm.txt
            ${{ runner.temp }}/oracle-transcript.log.*
          if-no-files-found: ignore
