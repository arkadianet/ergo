name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Iteration speed: a new push to the same branch cancels the superseded
# run instead of queueing behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: every job here only reads the repo (build/test/lint/audit).
permissions:
  contents: read

env:
  # CI speed levers (biggest win on the 4-core Windows runner):
  # - line-tables-only backtraces instead of full debuginfo: MSVC codegen
  #   and linking shrink dramatically; panic messages still carry locations.
  # - incremental off: cargo's own guidance for shared-cache CI —
  #   incremental artifacts don't survive cache round-trips and bloat them.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    name: Check, clippy, test (${{ matrix.os }})${{ matrix.shard && format(' shard {0}/{1}', matrix.shard, matrix.shards) || '' }}
    runs-on: ${{ matrix.os }}
    # Job-scoped so audit/deny/machete legs never see RUSTC_WRAPPER without
    # a sccache binary installed. Declared here rather than appended to
    # GITHUB_ENV from a run step — no shell differences between bash and
    # pwsh on the Windows runner.
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-latest
            shard: 1
            shards: 2
          - os: macos-latest
            shard: 2
            shards: 2
          - os: windows-latest
            shard: 1
            shards: 4
          - os: windows-latest
            shard: 2
            shards: 4
          - os: windows-latest
            shard: 3
            shards: 4
          - os: windows-latest
            shard: 4
            shards: 4

    steps:
      - uses: actions/checkout@v4

      # Run 35522674758: Windows nextest spent ~34 minutes testing after
      # 11.5 minutes building. The 25 tests above 60s sum to 95 minutes on
      # Windows versus 5.2 on Ubuntu: sequential redb commits are disk-bound.
      # Defender exclusions and TMP/TEMP on RUNNER_TEMP reduced the prior
      # Windows test phase by 1.55x. Defender failures remain non-fatal.
      - name: Windows I/O tuning (Defender exclusions, temp on workspace volume)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          try {
            Add-MpPreference -ExclusionPath `
              "$env:GITHUB_WORKSPACE", "$env:RUNNER_TEMP", `
              "$env:USERPROFILE\.cargo", "$env:USERPROFILE\.rustup" -ErrorAction Stop
            Add-MpPreference -ExclusionProcess `
              "cargo.exe", "rustc.exe", "link.exe", "sccache.exe", "cargo-nextest.exe" -ErrorAction Stop
            Write-Host "Defender exclusions registered."
          } catch {
            Write-Host "::warning::Defender exclusions unavailable: $($_.Exception.Message)"
          }
          # Redirect the temp dir onto the same volume as the workspace so
          # `tempfile::tempdir()` stops paying C:-disk latency per redb commit.
          "TMP=$env:RUNNER_TEMP"  | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TEMP=$env:RUNNER_TEMP" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "TMP/TEMP -> $env:RUNNER_TEMP"

      # Toolchain is pinned via rust-toolchain.toml at the repo root.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          # Shards share dependency artifacts; each links its own crate group.
          key: ${{ matrix.os }}

      # Cross-run compilation cache on top of rust-cache: rust-cache restores
      # dependency artifacts, sccache also caches *workspace* crates whose
      # sources changed — the common case for PR iterations.
      - uses: mozilla-actions/sccache-action@v0.0.11

      - name: cargo fmt
        run: cargo fmt --all -- --check

      # NOTE: no separate `cargo check --all` step — clippy runs check
      # under the hood, so a standalone check pass is pure duplicate work.

      # Default-feature linting here; the full --all-features lint runs once
      # on ubuntu below (feature combos don't vary meaningfully per-OS, and
      # --all-features materially grows the dependency graph per leg).
      # Shard 1 still covers cfg(windows)-specific lints; macOS also lints
      # once, on shard 1. Ubuntu remains a single unsharded leg.
      - name: cargo clippy
        if: (runner.os != 'Windows' || matrix.shard == 1) && (runner.os != 'macOS' || matrix.shard == 1)
        run: cargo clippy --all-targets -- -D warnings

      - uses: taiki-e/install-action@nextest

      # The guard and nextest read the same crate groups. A new workspace
      # member or split test target fails every shard until assigned; duplicates fail.
      - name: Validate crate-group membership
        if: runner.os != 'Linux'
        run: python scripts/ci-shards.py --os "${{ runner.os }}" --shard ${{ matrix.shard }} --shards ${{ matrix.shards }}

      # nextest: per-test processes with better parallelism; skips doctests,
      # which the ubuntu leg below covers explicitly so coverage is retained.
      - name: cargo nextest run
        if: runner.os == 'Linux'
        run: cargo nextest run --workspace

      - name: cargo nextest run (macOS shard)
        if: runner.os == 'macOS'
        run: python scripts/ci-shards.py --os macOS --shard ${{ matrix.shard }} --shards ${{ matrix.shards }} --run

      # The slow redb tests are 15–27x slower on Windows than Ubuntu due
      # to disk waits. Eight threads (2x the runner's four cores) overlap
      # those waits. Crate groups avoid linking other shards' test binaries.
      # Four Windows groups predict 8.25–8.6 min including job overhead;
      # node lib/it build separately. See scripts/ci-shards.py for assumptions.
      - name: cargo nextest run (Windows shard)
        if: runner.os == 'Windows'
        run: python scripts/ci-shards.py --os Windows --shard ${{ matrix.shard }} --shards ${{ matrix.shards }} --run

      # `cargo nextest run` above does not build with --features cost-trace,
      # so the feature-gated recording sites in `ergo-sigma` do not get
      # exercised. This step compiles and runs the two integration tests
      # that DO exercise the feature (`cost_trace_smoke` covers OP/Method
      # recording sites and the trace-shape contract; `traced_untraced_parity`
      # guards that enabling the feature does not perturb result or cost).
      # Coverage is narrow but enough to catch the common regression class
      # — a feature-gated `cost_trace::record(...)` site referencing the
      # wrong identifier and breaking the build under the feature.
      - name: cargo test (cost-trace feature)
        run: cargo test -p ergo-sigma --features cost-trace --test it -- cost_trace_smoke traced_untraced_parity

      # Doctest coverage lives on the fastest runner only — every other leg
      # already exercises the same crates via nextest above.
      - name: doc tests (ubuntu only)
        if: runner.os == 'Linux'
        run: cargo test --all --doc

  check-required:
    # Preserve the existing branch-protection context. A failed, cancelled,
    # or skipped matrix must never turn this required check green.
    name: Check, clippy, test (${{ matrix.os }})
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    needs: check
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all check legs to succeed
        env:
          CHECK_RESULT: ${{ needs.check.result }}
        run: test "$CHECK_RESULT" = success

  clippy-all-features:
    name: clippy (--all-features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: clippy-all-features
      - name: cargo clippy (all features)
        run: cargo clippy --all-targets --all-features -- -D warnings

  audit:
    name: cargo-audit (security advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: audit
      - name: install cargo-audit
        run: cargo install cargo-audit --locked
      - name: cargo audit
        # --ignore RUSTSEC-2025-0141: bincode 1.x is unmaintained with no
        # patched version. It is used only for local wallet-state persistence
        # (not consensus), and migrating would break existing wallet DBs.
        # Full rationale lives in deny.toml [advisories]; keep the two in sync.
        run: cargo audit --deny warnings --ignore RUSTSEC-2025-0141

  deny:
    name: cargo-deny (licenses + duplicates + advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: deny
      - name: install cargo-deny
        run: cargo install cargo-deny --locked
      - name: cargo deny check
        run: cargo deny check

  machete:
    name: cargo-machete (unused dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: machete
      - name: install cargo-machete
        run: cargo install cargo-machete --locked
      - name: cargo machete
        run: cargo machete

  diagnostics:
    name: cargo build (diagnostics feature compile-check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: diagnostics
      # The diagnostic-only integration tests (`diagnose_block_*`,
      # `trace_*`, `parity_triage`, `eval_error_triage`, `cost_parity`,
      # `m7_scala_oracle`, `roundtrip_triage`) are gated behind the
      # `diagnostics` feature in their respective crates. Compile-only
      # because most need external state (gitignored mainnet vectors,
      # captured `/tmp/block_*.json` files, a running Scala node) that
      # CI doesn't have. The compile guarantees the feature-gated
      # bodies stay valid — runtime execution stays operator-driven.
      - name: cargo test --features diagnostics --no-run (ergo-validation)
        run: cargo test --no-run -p ergo-validation --features diagnostics
      - name: cargo test --features diagnostics --no-run (ergo-mempool)
        run: cargo test --no-run -p ergo-mempool --features diagnostics
      - name: cargo test --features diagnostics --no-run (ergo-ser)
        run: cargo test --no-run -p ergo-ser --features diagnostics

  difftest:
    name: difftest (structured hermetic campaign + coverage gate)
    runs-on: ubuntu-latest
    # Fail fast if the structured campaign hangs rather than burning the runner.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0

      - uses: Swatinem/rust-cache@v2
        with:
          key: difftest

      # Build in release mode so 50 000 iters stays under 2 minutes.
      - name: cargo build (release)
        run: cargo build --release -p ergo-difftest

      # Unit tests for fuzz_one (stable, no nightly required).
      - name: cargo test -p ergo-difftest
        run: cargo test -p ergo-difftest

      # Structured campaign: structure-aware generators + fixed-point invariant
      # + coverage gate. Exit non-zero on any invariant violation (Bug) OR if the
      # generator union coverage drops below 80 % of the declared adversarial
      # vocabulary. This catches a broken generator that silently stops producing
      # adversarial features.
      #
      # 50 000 iters ≈ 30 s on ubuntu-latest; full vocabulary is reachable in
      # < 40 000 iters per surface (verified by gen_coverage tests).
      #
      # The JVM-oracle differential and replay driver are NOT run here — they
      # need scala-cli + a live Scala node and are run manually by the operator.
      - name: run structured campaign (50 000 iters, min-coverage 0.80)
        run: |
          cargo run --release -p ergo-difftest -- \
            --structured --iters 50000 --min-coverage 0.80
