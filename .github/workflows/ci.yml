name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Exact commit to validate for a release
        type: string
        required: false
        default: ''

# Iteration speed: a new push to the same branch cancels the superseded
# run instead of queueing behind it.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: every job here only reads the repo (build/test/lint/audit).
permissions:
  contents: read

env:
  # CI speed levers (biggest win on the 4-core Windows runner):
  # - line-tables-only backtraces instead of full debuginfo: MSVC codegen
  #   and linking shrink dramatically; panic messages still carry locations.
  # - incremental off: cargo's own guidance for shared-cache CI —
  #   incremental artifacts don't survive cache round-trips and bloat them.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    name: Check, clippy, test (${{ matrix.os }})${{ matrix.shard && format(' shard {0}/{1}', matrix.shard, matrix.shards) || '' }}
    runs-on: ${{ matrix.os }}
    # Job-scoped so audit/deny/machete legs never see RUSTC_WRAPPER without
    # a sccache binary installed. Declared here rather than appended to
    # GITHUB_ENV from a run step — no shell differences between bash and
    # pwsh on the Windows runner.
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-latest
            shard: 1
            shards: 2
          - os: macos-latest
            shard: 2
            shards: 2
          - os: windows-latest
            shard: 1
            shards: 4
          - os: windows-latest
            shard: 2
            shards: 4
          - os: windows-latest
            shard: 3
            shards: 4
          - os: windows-latest
            shard: 4
            shards: 4

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      # Run 35522674758: Windows nextest spent ~34 minutes testing after
      # 11.5 minutes building. The 25 tests above 60s sum to 95 minutes on
      # Windows versus 5.2 on Ubuntu: sequential redb commits are disk-bound.
      # Defender exclusions and TMP/TEMP on RUNNER_TEMP reduced the prior
      # Windows test phase by 1.55x. Defender failures remain non-fatal.
      - name: Windows I/O tuning (Defender exclusions, temp on workspace volume)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          try {
            Add-MpPreference -ExclusionPath `
              "$env:GITHUB_WORKSPACE", "$env:RUNNER_TEMP", `
              "$env:USERPROFILE\.cargo", "$env:USERPROFILE\.rustup" -ErrorAction Stop
            Add-MpPreference -ExclusionProcess `
              "cargo.exe", "rustc.exe", "link.exe", "sccache.exe", "cargo-nextest.exe" -ErrorAction Stop
            Write-Host "Defender exclusions registered."
          } catch {
            Write-Host "::warning::Defender exclusions unavailable: $($_.Exception.Message)"
          }
          # Redirect the temp dir onto the same volume as the workspace so
          # `tempfile::tempdir()` stops paying C:-disk latency per redb commit.
          "TMP=$env:RUNNER_TEMP"  | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TEMP=$env:RUNNER_TEMP" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "TMP/TEMP -> $env:RUNNER_TEMP"

      # Toolchain is pinned via rust-toolchain.toml at the repo root.
      - uses: ./.github/actions/rust
        id: rust

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # Shards share dependency artifacts; each links its own crate group.
          key: ${{ matrix.os }}

      # Cross-run compilation cache on top of rust-cache: rust-cache restores
      # dependency artifacts, sccache also caches *workspace* crates whose
      # sources changed — the common case for PR iterations.
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: cargo fmt
        run: |
          cargo fmt --all -- --check
          python3 scripts/check-rust-fragments.py

      # NOTE: no separate `cargo check --locked --all` step — clippy runs check
      # under the hood, so a standalone check pass is pure duplicate work.

      # Default-feature linting here; the full --all-features lint runs once
      # on ubuntu below (feature combos don't vary meaningfully per-OS, and
      # --all-features materially grows the dependency graph per leg).
      # Shard 1 still covers cfg(windows)-specific lints; macOS also lints
      # once, on the last (lightest) shard. Ubuntu remains a single unsharded leg.
      - name: cargo clippy --locked
        if: (runner.os != 'Windows' || matrix.shard == matrix.shards) && (runner.os != 'macOS' || matrix.shard == matrix.shards)
        run: cargo clippy --locked --all-targets -- -D warnings

      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2
        with:
          tool: cargo-nextest@${{ steps.rust.outputs.nextest }}

      # The guard and nextest read the same crate groups. A new workspace
      # member or split test target fails every shard until assigned; duplicates fail.
      - name: Validate crate-group membership
        if: runner.os != 'Linux'
        run: python scripts/ci-shards.py --os "${{ runner.os }}" --shard ${{ matrix.shard }} --shards ${{ matrix.shards }}

      # nextest: per-test processes with better parallelism; skips doctests,
      # which the ubuntu leg below covers explicitly so coverage is retained.
      - name: cargo nextest run --locked
        if: runner.os == 'Linux'
        run: cargo nextest run --locked --workspace

      - name: cargo nextest run --locked (macOS shard)
        if: runner.os == 'macOS'
        run: python scripts/ci-shards.py --os macOS --shard ${{ matrix.shard }} --shards ${{ matrix.shards }} --run

      # The slow redb tests are 15–27x slower on Windows than Ubuntu due
      # to disk waits. Eight threads (2x the runner's four cores) overlap
      # those waits. Crate groups avoid linking other shards' test binaries.
      # Four Windows groups predict 8.25–8.6 min including job overhead;
      # node lib/it build separately. See scripts/ci-shards.py for assumptions.
      - name: cargo nextest run --locked (Windows shard)
        if: runner.os == 'Windows'
        run: python scripts/ci-shards.py --os Windows --shard ${{ matrix.shard }} --shards ${{ matrix.shards }} --run

      # `cargo nextest run --locked` above does not build with --features cost-trace,
      # so the feature-gated recording sites in `ergo-sigma` do not get
      # exercised. This step compiles and runs the two integration tests
      # that DO exercise the feature (`cost_trace_smoke` covers OP/Method
      # recording sites and the trace-shape contract; `traced_untraced_parity`
      # guards that enabling the feature does not perturb result or cost).
      # Coverage is narrow but enough to catch the common regression class
      # — a feature-gated `cost_trace::record(...)` site referencing the
      # wrong identifier and breaking the build under the feature.
      - name: cargo test --locked (cost-trace feature)
        run: cargo test --locked -p ergo-sigma --features cost-trace --test it -- cost_trace_smoke traced_untraced_parity

      # Doctest coverage lives on the fastest runner only — every other leg
      # already exercises the same crates via nextest above.
      - name: doc tests (ubuntu only)
        if: runner.os == 'Linux'
        run: cargo test --locked --all --doc

      - name: Wallet proving feature tests (ubuntu only)
        if: runner.os == 'Linux'
        run: cargo test --locked -p ergo-wallet --all-features --test multi_sig_inline --test proving_internal_consistency

  wallet-interop:
    name: Scala wallet interoperability
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/rust
        id: rust
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: VirtusLab/scala-cli-setup@c33dfbf1a5f16ee60efff453b7f9a987d2b6955b # v1
        with:
          scala-cli-version: ${{ steps.rust.outputs.scala_cli }}
      - uses: sbt/setup-sbt@6158cb0903b8ceeae04f830055f3155e1b6a5ad7 # v1
        with:
          sbt-runner-version: 1.12.11
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # ergo-wallet 6.0.6 is published locally by the reference build,
      # rather than to Maven Central. A fresh runner needs this cold path.
      - name: Cache pinned Scala wallet dependencies
        id: wallet-oracle-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.ivy2/local
            ~/.cache/coursier
          key: wallet-oracle-${{ hashFiles('scripts/jvm_wallet_oracle/WalletOracle.scala') }}-23aabead88774d27f2c9190ace3c9abbc8f1d5cb
      - name: Publish reference wallet locally
        if: steps.wallet-oracle-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v6.0.6 https://github.com/ergoplatform/ergo.git "$RUNNER_TEMP/wallet-reference"
          cd "$RUNNER_TEMP/wallet-reference"
          test "$(git rev-parse HEAD)" = 23aabead88774d27f2c9190ace3c9abbc8f1d5cb
          sbt "ergoWallet/publishLocal"
      - name: Verify committed Scala fixtures
        shell: bash
        run: |
          scala-cli run scripts/jvm_wallet_oracle/WalletOracle.scala --server=false --jvm 17 > "$RUNNER_TEMP/scala-wallet.json"
          diff -u test-vectors/wallet/scala_6_0_6.json "$RUNNER_TEMP/scala-wallet.json"
      - name: Generate Rust wallet and unlock with Scala
        shell: bash
        run: |
          export ERGO_WALLET_INTEROP_FILE="$RUNNER_TEMP/rust-wallet.json"
          cargo test --locked -p ergo-wallet --all-features --test it rust_generated_file_exports_for_scala_verification
          scala-cli run scripts/jvm_wallet_oracle/WalletOracle.scala --server=false --jvm 17 -- verify "$ERGO_WALLET_INTEROP_FILE" test-rust-to-scala-pw

  check-required:
    # Preserve the existing branch-protection context. A failed, cancelled,
    # or skipped matrix or fuzz-lock gate must never turn this check green.
    name: Check, clippy, test (${{ matrix.os }})
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    needs: [check, fuzz-dependencies]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all check legs and fuzz dependency resolution to succeed
        env:
          CHECK_RESULT: ${{ needs.check.result }}
          FUZZ_RESULT: ${{ needs.fuzz-dependencies.result }}
        run: |
          test "$CHECK_RESULT" = success
          test "$FUZZ_RESULT" = success

  clippy-all-features:
    name: clippy (--all-features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/rust
        id: rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: clippy-all-features
      - name: cargo clippy --locked (all features)
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

  audit:
    name: cargo-audit (security advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/rust
        id: rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: audit
      - name: install cargo-audit
        run: cargo install cargo-audit --version ${{ steps.rust.outputs.audit }} --locked
      - name: cargo audit
        # --ignore RUSTSEC-2025-0141: bincode 1.x is unmaintained with no
        # patched version. It is used only for local wallet-state persistence
        # (not consensus), and migrating would break existing wallet DBs.
        # Full rationale lives in deny.toml [advisories]; keep the two in sync.
        run: cargo audit --deny warnings --ignore RUSTSEC-2025-0141

  deny:
    name: cargo-deny (licenses + duplicates + advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/rust
        id: rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: deny
      - name: install cargo-deny
        run: cargo install cargo-deny --version ${{ steps.rust.outputs.deny }} --locked
      - name: cargo deny check
        run: cargo deny check

  machete:
    name: cargo-machete (unused dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/rust
        id: rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: machete
      - name: install cargo-machete
        run: cargo install cargo-machete --version ${{ steps.rust.outputs.machete }} --locked
      - name: cargo machete
        run: cargo machete

  diagnostics:
    name: cargo build --locked (diagnostics feature compile-check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/rust
        id: rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: diagnostics
      # The diagnostic-only integration tests (`diagnose_block_*`,
      # `trace_*`, `parity_triage`, `eval_error_triage`, `cost_parity`,
      # `m7_scala_oracle`, `roundtrip_triage`) are gated behind the
      # `diagnostics` feature in their respective crates. Compile-only
      # because most need external state (gitignored mainnet vectors,
      # captured `/tmp/block_*.json` files, a running Scala node) that
      # CI doesn't have. The compile guarantees the feature-gated
      # bodies stay valid — runtime execution stays operator-driven.
      - name: cargo test --locked --features diagnostics --no-run (ergo-validation)
        run: cargo test --locked --no-run -p ergo-validation --features diagnostics
      - name: cargo test --locked --features diagnostics --no-run (ergo-mempool)
        run: cargo test --locked --no-run -p ergo-mempool --features diagnostics
      - name: cargo test --locked --features diagnostics --no-run (ergo-ser)
        run: cargo test --locked --no-run -p ergo-ser --features diagnostics

  difftest:
    name: difftest (structured hermetic campaign + coverage gate)
    runs-on: ubuntu-latest
    # Fail fast if the structured campaign hangs rather than burning the runner.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - uses: ./.github/actions/rust
        id: rust

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: difftest

      # Build in release mode so 50 000 iters stays under 2 minutes.
      - name: cargo build --locked (release)
        run: cargo build --locked --release -p ergo-difftest

      # Unit tests for fuzz_one (stable, no nightly required).
      - name: cargo test --locked -p ergo-difftest
        run: cargo test --locked -p ergo-difftest

      # Structured campaign: structure-aware generators + fixed-point invariant
      # + coverage gate. Exit non-zero on any invariant violation (Bug) OR if the
      # generator union coverage drops below 80 % of the declared adversarial
      # vocabulary. This catches a broken generator that silently stops producing
      # adversarial features.
      #
      # 50 000 iters ≈ 30 s on ubuntu-latest; full vocabulary is reachable in
      # < 40 000 iters per surface (verified by gen_coverage tests).
      #
      # The JVM-oracle differential and replay driver are NOT run here — they
      # need scala-cli + a live Scala node and are run manually by the operator.
      - name: run structured campaign (50 000 iters, min-coverage 0.80)
        run: |
          cargo run --locked --release -p ergo-difftest -- \
            --structured --iters 50000 --min-coverage 0.80

  fuzz-dependencies:
    name: Locked fuzz workspace dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/rust
        id: rust
        with:
          nightly: 'true'
          components: ''
      # Path dependencies inherit the stable workspace's dependency versions,
      # but Cargo resolves this detached workspace against its own lockfile.
      # Catch stale locks on PRs before the scheduled libFuzzer builds run.
      - name: Resolve committed fuzz dependencies with the pinned nightly
        run: |
          git ls-files --error-unmatch ergo-difftest/fuzz/Cargo.lock
          cargo +${{ steps.rust.outputs.nightly }} metadata --manifest-path ergo-difftest/fuzz/Cargo.toml --locked --format-version 1 > /dev/null
          git diff --exit-code -- ergo-difftest/fuzz/Cargo.lock

  documentation:
    name: Strict public Rustdoc and engineering policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/rust
        id: rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: documentation
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.rust.outputs.node }}
      - name: Browser model regressions
        run: node --experimental-default-type=module --test ergo-api/web/tests/*.test.mjs
      - name: Voting model regression
        run: node scripts/test-voting-ui.cjs
      - name: Shared compiler, lint, action and lockfile policy
        run: python scripts/ci-policy.py
      - name: Engineering policy and release helper tests
        run: |
          python -m unittest discover -s scripts -p 'test_release*.py'
          python -m unittest discover -s scripts -p 'test_evaluated_probe.py'
          python -m unittest discover -s scripts -p 'test_difftest_records.py'
          python -m unittest discover -s scripts -p 'test_difftest_reinject.py'
      - name: Strict public documentation (all features)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --all-features --no-deps
