name: Portable wallet library
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/rust
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Portable dependency boundary
        run: python3 scripts/check-wallet-portable.py
      - name: Core library feature tests
        run: cargo test --locked -p ergo-wallet --no-default-features
      - name: CLI and keystore compatibility
        run: cargo test --locked -p ergo-wallet --features cli
      - name: Core library clippy
        run: cargo clippy --locked -p ergo-wallet --no-default-features --all-targets -- -D warnings
      - name: Android libraries (no NDK link required)
        run: |
          cargo check --locked -p ergo-wallet -p ergo-sigma -p ergo-ser -p ergo-primitives --lib --no-default-features --target aarch64-linux-android
          cargo check --locked -p ergo-wallet -p ergo-sigma -p ergo-ser -p ergo-primitives --lib --no-default-features --target x86_64-linux-android
