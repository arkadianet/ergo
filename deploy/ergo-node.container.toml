network = "mainnet"
data_dir = "/var/lib/ergo"

[peers]
bind_addr = "0.0.0.0:9030"

[api]
bind = "0.0.0.0:9099"
public_bind = true
# The Compose host mapping restricts HTTP to host loopback. Supply a hash
# before using privileged routes; no template API credential is embedded.

[api.security]
# api_key_hash = "<64 lowercase hex chars of Blake2b256(random secret)>"

[api.readiness]
heartbeat_max_age_ms = 600000
snapshot_max_age_ms = 30000
tip_max_age_ms = 7200000

[logging]
default_level = "info"
format = "json"
