# description = "#2563 with the review fixes, on a1bd938ef: the patched follower of arm A and the flood target"
#
# [builds."2563f+2506"]
# work_dir = ".work-2563f+2506-<commit>"
# ergo_ref = "<full commit of the merge 2563f + c11df116e>"
