# [builds."base+2506"]
# work_dir = ".work-base+2506-<commit>"
# ergo_ref = "<full commit of the merge a1bd938ef + #2506 c11df116ea372234d8b0b6fdd931401d4a02a091>"
# branch = "<local merge branch>"
# description = "a1bd938ef + #2506 (processed-tip replay, sender side): miner and stock follower of arm B"
