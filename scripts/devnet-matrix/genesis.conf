# Shared private-chain parameters for the Matrix (input-block) smoke.
# Rust counterparts: ChainSpec::devnet() plus the devnet-only
# `[chain] devnet_initial_difficulty_hex` / `devnet_miner_reward_delay`
# overrides in rust-node.toml. Every value here that the Rust node also
# models MUST match its counterpart or the two nodes fork.
ergo {
  networkType = "devnet60"
  chain {
    protocolVersion = 4
    addressPrefix = 16
    # Input blocks exist only when the Autolykos target leaves room
    # between `d <= b` (ordering) and `d <= b * subblocksPerBlock`
    # (input). At difficulty 1, b = q and every solution is an ordering
    # block. This value is tuned for the JVM CPU miner: see README.
    # NOTE the leading zero byte. Scala decodes this hex to BYTES and
    # reads them as a SIGNED BigInt, so a value whose top byte is >= 0x80
    # ("9c40") is NEGATIVE: `b = q / difficulty` goes negative and NO
    # solution ever qualifies — the miner spins on millions of nonces
    # finding nothing. Always keep the leading byte below 0x80.
    initialDifficultyHex = "004e20"
    epochLength = 33554432
    blockInterval = 20s
    # Derived from the settings below, NOT the stock devnet value:
    # `minerRewardDelay` feeds the emission box proposition, so shortening
    # it changes the genesis boxes and their root. Captured from this
    # node's own `GET /utxo/genesis` (see test-vectors/devnet/).
    genesisStateDigestHex = "c01a142d004a917b4af35385265748e37f7c77ab8a4e8b2080b9c193516b845602"
    # Shortened so a miner reward matures inside the smoke, which is what
    # funds the 20 mempool transactions assertion 6 needs. Mirrored by
    # `[chain] devnet_miner_reward_delay` on the Rust side; the two MUST
    # agree or the nodes compute different genesis boxes.
    monetary.minerRewardDelay = 10
    voting {
      votingLength = 33554432
      softForkEpochs = 32
      activationEpochs = 32
      version2ActivationHeight = 2147483647
      version2ActivationDifficultyHex = "20"
    }
    reemission {
      checkReemissionRules = false
      activationHeight = 100000001
    }
  }
}
scorex.network {
  magicBytes = [7, 7, 7, 7]
  knownPeers = ["127.0.0.1:19561"]
}
