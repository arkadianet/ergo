# Shared private-chain parameters for the Matrix (input-block) smoke.
# Rust counterparts: ChainSpec::devnet() plus the devnet-only
# `[chain] devnet_initial_difficulty_hex` / `devnet_miner_reward_delay`
# overrides in rust-node.toml. Every value here that the Rust node also
# models MUST match its counterpart or the two nodes fork.
ergo {
  networkType = "devnet60"
  chain {
    protocolVersion = 4
    addressPrefix = 16
    # Input blocks exist only when the Autolykos target leaves room
    # between `d <= b` (ordering) and `d <= b * subblocksPerBlock`
    # (input). At difficulty 1, b = q and every solution is an ordering
    # block. This value is tuned for the JVM CPU miner: see README.
    initialDifficultyHex = "4e20"
    epochLength = 33554432
    blockInterval = 20s
    genesisStateDigestHex = "cb63aa99a3060f341781d8662b58bf18b9ad258db4fe88d09f8f71cb668cad4502"
    monetary.minerRewardDelay = 720
    voting {
      votingLength = 33554432
      softForkEpochs = 32
      activationEpochs = 32
      version2ActivationHeight = 2147483647
      version2ActivationDifficultyHex = "20"
    }
    reemission {
      checkReemissionRules = false
      activationHeight = 100000001
    }
  }
}
scorex.network {
  magicBytes = [7, 7, 7, 7]
  knownPeers = ["127.0.0.1:19561"]
}
