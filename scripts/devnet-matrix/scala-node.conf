include "genesis.conf"
ergo {
  directory = "scripts/devnet-matrix/.work/scala"
  node {
    headerChainDiff = 800
    # The weak-blocks branch has NO switch for input blocks: they are
    # produced by the internal CPU miner (ErgoMiningThread ->
    # InputBlockFound -> CandidateGenerator.LocallyGeneratedInputBlock).
    # So the internal miner must run; there is no external solver here.
    mining = true
    offlineGeneration = true
    useExternalMiner = false
    internalMinerPollingInterval = 500ms
    extraIndex = true
  }
  wallet.secretStorage.secretDir = ${ergo.directory}"/wallet/keystore"
}
scorex {
  network {
    bindAddress = "127.0.0.1:19560"
    declaredAddress = "127.0.0.1:19560"
    nodeName = "matrix-scala"
    localOnly = true
    syncInterval = 1s
    syncIntervalStable = 1s
    syncStatusRefresh = 2s
    syncStatusRefreshStable = 2s
  }
  restApi {
    bindAddress = "127.0.0.1:19580"
    apiKeyHash = "324dcf027dd4a30a932c441f365a25e86b173defa4b8e58948253471b81b72cf"
  }
}
