# The SECOND Matrix (input blocks) miner, for the campaign's `fork` and
# `rollback` scenarios. Two miners on one private chain is the only way
# to produce competing input-block trees under the same ordering block,
# and a full-block reorg the follower has to unwind.
#
# It is a peer of the first miner and of the Rust follower, not a clone:
# its own data directory gives it its OWN wallet, and therefore its own
# mining key, so the two miners' coinbases — and every block built on
# them — differ. (`miningPubKeyHex` would pin the key explicitly, but it
# also bypasses the wallet the internal miner needs unlocked here; a
# separate keystore reaches the same place through the supported path.)
#
# Ports are the recipe defaults (19562 / 19582). The campaign renders an
# override that moves them into its own 19570-19572 / 19590-19592 band so
# it can run beside a smoke in another worktree; see campaign.py.
include "genesis.conf"
ergo {
  directory = "scripts/devnet-matrix/.work/scala2"
  node {
    headerChainDiff = 800
    mining = true
    # NOT `offlineGeneration`: the second miner must mine on the chain it
    # shares with the first, and an offline generator builds candidates
    # without waiting for the network — which is how two miners on one
    # devnet drift into two permanent chains instead of one that forks
    # and heals. The `rollback` scenario switches this on deliberately,
    # for exactly as long as it wants a private branch.
    offlineGeneration = false
    useExternalMiner = false
    internalMinerPollingInterval = 500ms
    extraIndex = true
  }
  wallet.secretStorage.secretDir = ${ergo.directory}"/wallet/keystore"
}
scorex {
  network {
    bindAddress = "127.0.0.1:19562"
    declaredAddress = "127.0.0.1:19562"
    nodeName = "matrix-scala2"
    localOnly = true
    syncInterval = 1s
    syncIntervalStable = 1s
    syncStatusRefresh = 2s
    syncStatusRefreshStable = 2s
  }
  restApi {
    bindAddress = "127.0.0.1:19582"
    apiKeyHash = "324dcf027dd4a30a932c441f365a25e86b173defa4b8e58948253471b81b72cf"
  }
}
