[package]
name        = "ergo-node"
description = "Operator binary and runtime crate for the Ergo Rust full node. Wires the workspace's component crates (state, p2p, sync, mempool, indexer, API) into a single async runtime, owns process-level lifecycle (config, data-dir layout, graceful shutdown, peer loop, submission action loop), and exposes the API trait surface to ergo-api over an Arc<NodeSnapshot>."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish    = false

[lib]
name = "ergo_node"
path = "src/lib.rs"

[[bin]]
name = "ergo-node"
path = "src/main.rs"

[dependencies]
ergo-primitives = { workspace = true }
ergo-ser        = { workspace = true }
ergo-chain-spec = { workspace = true }
ergo-crypto     = { workspace = true }
ergo-validation = { workspace = true }
ergo-wallet        = { workspace = true, features = ["keystore"] }
ergo-wallet-service = { workspace = true }
ergo-wallet-protocol = { workspace = true }
ergo-state      = { workspace = true }
ergo-p2p        = { workspace = true }
ergo-sync       = { workspace = true }
ergo-mempool    = { workspace = true }
ergo-mining     = { workspace = true }
ergo-indexer    = { workspace = true }
ergo-api        = { workspace = true }
ergo-rest-json  = { workspace = true }
redb_legacy     = { workspace = true }
redb            = { workspace = true, features = ["logging"] }
bincode         = { workspace = true }
arc-swap        = { workspace = true }
parking_lot     = { workspace = true }
rayon           = { workspace = true }
clap            = { workspace = true, features = ["derive"] }
hex             = { workspace = true }
sha2            = { workspace = true }
indexmap        = { workspace = true }
num-bigint      = { workspace = true }
serde           = { workspace = true, features = ["derive"] }
serde_json         = { workspace = true, features = ["arbitrary_precision"] } # v1 d = arbitrary-precision JSON number (api_bridge::compat relies on this; do not remove)
tokio           = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "fs", "sync", "time", "signal"] }
toml            = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender   = { workspace = true }
async-trait        = { workspace = true }
# Shadow-validation reference client (loopback/LAN Scala node). Same
# rustls-only dependency policy as the ergo-api webhook sink.
reqwest            = { workspace = true, features = ["rustls-tls", "json"] }
thiserror          = { workspace = true }
fs4                = { workspace = true }
sysinfo            = { workspace = true }
maxminddb          = { workspace = true }
dns-lookup         = { workspace = true }
flate2             = { workspace = true }
tempfile           = { workspace = true }
time               = { workspace = true }
k256               = { workspace = true }
rand               = { workspace = true }
zeroize            = { workspace = true }
ergo-sigma         = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["fs"] }

[dev-dependencies]
axum = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
ergo-api           = { workspace = true }
ergo-mempool       = { workspace = true, features = ["test-support"] }
ergo-p2p           = { workspace = true }
ergo-primitives    = { workspace = true }
ergo-state         = { workspace = true, features = ["test-helpers", "test-utils"] }
# Fast keystore key derivation in tests only (absent from release builds).
ergo-wallet        = { workspace = true, features = ["keystore", "test-utils"] }
ergo-sync          = { workspace = true }
ergo-chain-spec    = { workspace = true }
arc-swap           = { workspace = true }
tracing-subscriber = { workspace = true }

[[test]]
name = "it"
path = "tests/it/main.rs"

# Its scan/verdict regression tests must run with the workspace tests;
# examples are otherwise only compiled.
[[example]]
name = "ge_soak"
test = true

[lints]
workspace = true

[[bench]]
name = "mempool_publication"
path = "benches/mempool_publication.rs"
harness = false
