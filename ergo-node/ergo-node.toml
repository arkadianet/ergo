# Ergo Rust Node — ready-to-use default: a full-archival node with the
# /blockchain/* extra-index enabled. Run with:
#
#   ergo-node --config ergo-node.toml
#
# Every other knob (alternative modes, fast bootstrap, tuning, mining) is
# documented in the fully-commented reference: ergo-node.toml.example.

network  = "mainnet"             # or "testnet"
# data_dir = "./ergo-data"       # default; holds the node DB + logs

[node]
agent_name = "ergo-rust"
node_name  = "ergo-rust-node"
# Full archival is the default and needs no knobs: state_type = "utxo",
# verify_transactions = true, blocks_to_keep = -1 — keep every block, validate
# every transaction, and sync from genesis.

[peers]
target_outbound = 96
max_connections = 384
# max_inbound defaults to 256 — an independent inbound budget, so a full
# outbound set never reduces inbound capacity.
# allow_local defaults to false: addresses on the local network (loopback,
# RFC1918, link-local, IPv6 unique-local, carrier-grade NAT) are not learned
# from gossip, dialed, or shared. Set it true for a LAN devnet whose peers
# must discover each other over private addresses. Addresses listed in
# `known` above are dialed regardless of this setting.
# allow_local = false
# The bundled mainnet seed peers are merged in automatically; add your own here.

[api]
# Dashboard, swagger, public reads and transaction submission work without a key.
# Privileged routes stay locked: /wallet/*, /scan/*, /api/v1/wallet/*,
# /node/shutdown, /api/v1/node/shutdown, /peers/connect, POST /api/v1/votes,
# POST /blocks, /mining/* and v1 Operator/Admin routes (accounts, webhooks, operator controls).
# To unlock them, generate a random secret and its Blake2b-256 hash:
#   secret=$(openssl rand -hex 32); printf '%s' "$secret" | b2sum -l 256 | cut -d' ' -f1
# Save the secret for the api_key header; set the hash in [api.security]
# below, then restart. See docs/configuration.md.
disabled = false
bind = "127.0.0.1:9099"          # loopback only. To expose on the network add
                                 # `public_bind = true` (and read the note below).
# Peer enrichment makes no external requests by default. Native peer details
# and installed local IP databases remain available in the Peers dashboard.
# Set auto_download = true to fetch/update free DB-IP Lite City + ASN datasets
# over HTTPS (no account or API key). Downloads never include peer IPs.
peer_details.auto_download = false
# Separate opt-in: reverse DNS sends public peer IPs to the OS DNS resolver.
peer_details.reverse_dns = false
# Advanced local MMDB overrides; paths are relative to data_dir. Restart to load.
# peer_details.geoip_db = "geoip/my-city.mmdb"
# peer_details.asn_db = "geoip/my-asn.mmdb"
# local_reverse_proxy = false  # set true when a proxy connects to this loopback API.
# All clients on the proxy peer IP (127.0.0.1 or ::1) share one v1 governor
# bucket: burst 40, refill 20 tokens/s, Compute cost 10. Direct local operator
# access also loses its exemption. Rate-limit per client at the proxy; raising
# governor limits are configured in [api.limits] or patched through node/config.
# The realtime cap is 16 sockets TOTAL per peer IP across proxied and direct
# local clients, regardless of this flag. Budget WebSocket concurrency.
# With this flag, ALL API tx submissions use the public mempool global budget,
# including direct local submissions; they cannot use the local reserve.
# Admin requests with a valid key warn-and-allow; this does not enable hard deny.
# This flag does not authenticate clients. X-Forwarded-For is never trusted. See docs/configuration.md for details.
# allowed_hosts = ["my-node.example.com"]  # extra Host headers to accept, guarding
                                 # against DNS rebinding (default []; loopback binds
                                 # always accept localhost/127.0.0.1/::1/the bind IP).
# [api.security]
# api_key_hash = "<64 lowercase hex characters>"

[store]
# Convert legacy 0.11 redb files before opening storage; retains migrated originals.
auto_upgrade_legacy = true
# Stale derived indexers are deleted first by default; both versions can rebuild them.
auto_upgrade_keep_stale_indexer = false

[indexer]
enabled = true                   # /blockchain/* extra-index (boxes, tokens,
                                 # addresses). Builds indexer.redb under data_dir
                                 # on first start; requires this full-archival setup.

[mining]
enabled = false                  # external-miner API (GET /mining/candidate +
                                 # POST /mining/solution). See ergo-node.toml.example
                                 # for the reward-key and storage-rent knobs.

[logging]
default_level = "info"

[logging.file]
dir       = "."
prefix    = "ergo-node"
rotation  = "daily"
max_files = 14
