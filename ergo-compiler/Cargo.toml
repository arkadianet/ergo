[package]
name        = "ergo-compiler"
description = "ErgoScript → ErgoTree compiler. Parser, binder, typer, graph transformations and wire emission tested against pinned Scala fixtures, with explicit compiled-output validation."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish    = false

[dependencies]
thiserror        = { workspace = true }
ergo-ser         = { workspace = true }
ergo-primitives  = { workspace = true }
ergo-crypto      = { workspace = true }
bs58             = { workspace = true }
base64           = { workspace = true }
num-bigint       = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
hex        = { workspace = true }
# Semantic-smoke oracle for emitted IR (evaluator-side; no dependency cycle —
# ergo-sigma depends on ergo-ser only).
ergo-sigma = { workspace = true }

[[test]]
name = "it"
path = "tests/it/main.rs"

[lints]
workspace = true
